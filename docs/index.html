<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#14081a">
<title>寶貝切切樂</title>
<style>
  :root {
    --bg: #14081a;
    --panel: rgba(30, 12, 40, 0.92);
    --pink: #ff5c8a;
    --pink2: #ff9ec0;
    --gold: #ffd166;
    --text: #fff5f8;
    --muted: #cfa9c4;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
    touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }
  .hidden { display: none !important; }

  #hud { position: fixed; inset: 0; pointer-events: none;
    padding: calc(env(safe-area-inset-top) + 10px) 14px 0; }
  .hud-left { position: absolute; left: 14px; top: calc(env(safe-area-inset-top) + 10px); }
  .hud-right { position: absolute; right: 14px; top: calc(env(safe-area-inset-top) + 10px); text-align: right; }
  #score { font-size: 40px; font-weight: 900; color: var(--gold); text-shadow: 0 3px 0 #a0522d, 0 0 12px rgba(255,209,102,.5); line-height: 1; }
  #best-hud { font-size: 13px; color: var(--muted); margin-top: 4px; }
  #hearts { font-size: 24px; letter-spacing: 2px; }
  #coins-hud { font-size: 16px; font-weight: 700; color: var(--gold); margin-top: 4px; }
  #blade-hud { font-size: 13px; color: var(--muted); margin-top: 2px; }
  #pause-btn { pointer-events: auto; position: absolute; right: 14px; top: calc(env(safe-area-inset-top) + 92px);
    width: 42px; height: 42px; border-radius: 50%; border: 2px solid rgba(255,255,255,.25);
    background: rgba(0,0,0,.3); color: #fff; font-size: 18px; }
  #boss-bar { position: absolute; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top) + 64px);
    width: min(56vw, 320px); text-align: center; }
  #boss-name { font-weight: 900; font-size: 16px; color: #ffb3c6; text-shadow: 0 2px 0 #000; margin-bottom: 4px; }
  .bar { height: 14px; border-radius: 7px; background: rgba(0,0,0,.5); border: 2px solid #ffb3c6; overflow: hidden; }
  #boss-hp { height: 100%; width: 100%; background: linear-gradient(90deg, #ff2e63, #ff9f1c); transition: width .1s; }

  .screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 20px);
    background: rgba(20, 8, 26, 0.72); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); text-align: center; }
  .title { font-size: clamp(40px, 12vw, 64px); font-weight: 900; line-height: 1.05; margin: 0;
    background: linear-gradient(180deg, #fff 0%, var(--pink2) 45%, var(--pink) 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 4px 0 #7a1f4a) drop-shadow(0 0 18px rgba(255,92,138,.5)); }
  .subtitle { color: var(--muted); font-size: 16px; margin: 0; }
  .fruit-row { font-size: 40px; display: flex; gap: 6px; }
  .fruit-row span { display: inline-block; animation: bob 1.6s ease-in-out infinite; }
  .fruit-row span:nth-child(2) { animation-delay: .2s } .fruit-row span:nth-child(3) { animation-delay: .4s }
  .fruit-row span:nth-child(4) { animation-delay: .6s } .fruit-row span:nth-child(5) { animation-delay: .8s }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-8deg) } 50% { transform: translateY(-12px) rotate(8deg) } }
  .btn { pointer-events: auto; border: none; border-radius: 999px; padding: 14px 34px; min-width: 220px;
    font: inherit; font-size: 20px; font-weight: 800; color: #fff; cursor: pointer;
    background: linear-gradient(180deg, #ff7aa2, #e83e72); box-shadow: 0 5px 0 #8f1d47, 0 8px 20px rgba(232,62,114,.35); }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #8f1d47; }
  .btn.alt { background: linear-gradient(180deg, #8a6bff, #5b3fd6); box-shadow: 0 5px 0 #33208a, 0 8px 20px rgba(91,63,214,.35); }
  .btn.ghost { background: rgba(255,255,255,.12); box-shadow: none; font-size: 17px; }
  .stat { color: var(--muted); font-size: 15px; }
  .stat b { color: var(--gold); }
  .big-score { font-size: 72px; font-weight: 900; color: var(--gold); line-height: 1; text-shadow: 0 4px 0 #a0522d; }
  .badge { display: inline-block; background: var(--gold); color: #4a2a00; font-weight: 900; border-radius: 999px; padding: 4px 14px; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { transform: scale(1.1) } }

  #shop { justify-content: flex-start; overflow-y: auto; touch-action: pan-y; }
  #shop h2 { margin: 6px 0 0; font-size: 30px; }
  .tabs { display: flex; gap: 8px; width: 100%; max-width: 440px; }
  .tab { pointer-events: auto; flex: 1; border: 2px solid rgba(255,158,192,.3); border-radius: 999px; padding: 10px; font: inherit; font-size: 16px;
    font-weight: 800; color: var(--muted); background: rgba(255,255,255,.06); cursor: pointer; }
  .tab.active { color: #fff; background: linear-gradient(180deg, #ff7aa2, #e83e72); border-color: transparent; }
  #version { position: fixed; bottom: calc(env(safe-area-inset-bottom) + 8px); right: 12px; font-size: 12px; color: rgba(255,255,255,.35); }
  #shop-list { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 12px; }
  .card { background: var(--panel); border: 2px solid rgba(255,158,192,.25); border-radius: 18px; padding: 14px; text-align: left;
    display: grid; grid-template-columns: 56px 1fr; gap: 4px 12px; }
  .card.equipped { border-color: var(--gold); box-shadow: 0 0 16px rgba(255,209,102,.3); }
  .card .icon { font-size: 40px; grid-row: span 3; align-self: center; text-align: center; }
  .card .name { font-size: 19px; font-weight: 800; }
  .card .lv { color: var(--gold); font-size: 14px; margin-left: 6px; }
  .card .desc { font-size: 14px; color: var(--muted); }
  .card .fx { font-size: 13px; color: #ffe3ec; }
  .swatch { height: 6px; border-radius: 3px; grid-column: 1 / -1; margin-top: 6px; }
  .card .actions { grid-column: 1 / -1; display: flex; gap: 8px; margin-top: 8px; }
  .card .actions button { flex: 1; min-width: 0; padding: 10px 8px; font-size: 15px; }
  .btn:disabled { filter: grayscale(.8); opacity: .55; }


  #stages { justify-content: flex-start; overflow-y: auto; touch-action: pan-y; }
  #stages h2 { margin: 6px 0 0; font-size: 30px; }
  #stage-list { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 12px; }
  .stage { pointer-events: auto; border: 2px solid rgba(255,255,255,.18); border-radius: 18px; padding: 16px; text-align: left; color: #fff;
    font: inherit; display: grid; grid-template-columns: 56px 1fr auto; gap: 2px 12px; align-items: center; cursor: pointer;
    box-shadow: 0 6px 18px rgba(0,0,0,.35); }
  .stage .s-icon { font-size: 40px; grid-row: span 2; text-align: center; }
  .stage .s-name { font-size: 20px; font-weight: 900; text-shadow: 0 2px 0 rgba(0,0,0,.4); }
  .stage .s-info { font-size: 13px; opacity: .9; }
  .stage .s-go { grid-row: span 2; font-size: 26px; }
  .stage:disabled { filter: grayscale(1) brightness(.6); cursor: default; }
  #stage-hud { font-size: 13px; color: var(--muted); margin-top: 2px; }
  #clear .big-score { font-size: 56px; }
  .btn-row { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  #cloud, #nameset { overflow-y: auto; touch-action: pan-y; }
  #cloud h2, #nameset h2 { margin: 0; font-size: 26px; }
  .cloud-box { background: var(--panel); border: 2px solid rgba(255,158,192,.25); border-radius: 18px; padding: 12px 20px;
    display: flex; flex-direction: column; align-items: center; gap: 8px; max-width: 460px; width: 100%; }
  .cloud-box .stat { margin: 0; }
  .code { font: 900 30px/1.2 ui-monospace, "Cascadia Mono", Consolas, monospace; letter-spacing: 2px; color: var(--gold);
    user-select: all; -webkit-user-select: all; text-shadow: 0 2px 0 #a0522d; }
  .field { pointer-events: auto; font: inherit; font-size: 20px; padding: 12px 18px; border-radius: 14px; width: min(320px, 100%);
    border: 2px solid rgba(255,158,192,.4); background: rgba(0,0,0,.35); color: #fff; text-align: center;
    user-select: text; -webkit-user-select: text; touch-action: auto; }
  .field:focus { outline: none; border-color: var(--gold); }
  .grecaptcha-badge { visibility: hidden; } /* 不擋畫面；改在雲端存檔頁面放文字說明 */
  .legal { font-size: 11px; color: rgba(255,255,255,.4); margin: 0; }
  .legal a { color: inherit; }
  #shop-list, #stage-list { margin: 0 auto; }

  /* 橫屏：按鈕排成一排、商店每個項目是一整行（圖示｜說明｜按鈕） */
  @media (orientation: landscape) {
    .screen { justify-content: safe center; overflow-y: auto; touch-action: pan-y; gap: 10px;
      padding: calc(env(safe-area-inset-top) + 12px) calc(env(safe-area-inset-right) + 20px) calc(env(safe-area-inset-bottom) + 12px) calc(env(safe-area-inset-left) + 20px); }
    .btn-row { flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 12px; }
    .btn-row .btn { min-width: 170px; padding: 12px 26px; font-size: 18px; }
    .tabs { max-width: 520px; }
    #shop-list, #stage-list { max-width: 980px; }
    .card { grid-template-columns: 56px 1fr minmax(180px, 230px); gap: 2px 16px; align-items: center; padding: 12px 16px; }
    .card .icon { grid-row: 1 / span 4; }
    .card .name, .card .desc, .card .fx, .card .swatch { grid-column: 2; }
    .card .swatch { margin-top: 4px; }
    .card .actions { grid-column: 3; grid-row: 1 / span 4; flex-direction: column; margin-top: 0; }
    #stage-list { display: grid; grid-template-columns: 1fr 1fr; }
  }
  @media (orientation: landscape) and (max-height: 600px) {
    .title { font-size: clamp(30px, 11vh, 52px); }
    .fruit-row { font-size: 26px; }
    .big-score { font-size: 48px; }
    #clear .big-score { font-size: 44px; }
    #shop h2, #stages h2 { font-size: 24px; margin: 0; }
    .hint { display: none; }
        #score { font-size: 32px; }
    #pause-btn { top: calc(env(safe-area-inset-top) + 82px); }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="hidden">
  <div class="hud-left"><div id="score">0</div><div id="best-hud">最高 0</div><div id="stage-hud"></div></div>
  <div class="hud-right"><div id="hearts"></div><div id="coins-hud">💰 0</div><div id="blade-hud"></div></div>
  <button id="pause-btn" aria-label="暫停">⏸</button>
  <div id="boss-bar" class="hidden"><div id="boss-name"></div><div class="bar"><div id="boss-hp"></div></div></div>
</div>

<div id="menu" class="screen">
  <div class="fruit-row"><span>🍉</span><span>🍓</span><span>🍍</span><span>🍑</span><span>🍋</span></div>
  <h1 class="title" id="menu-title">寶貝切切樂</h1>
  <p class="subtitle" id="menu-sub"></p>
  <p class="stat">最高分 <b id="menu-best">0</b>　金幣 <b id="menu-coins">0</b></p>
  <div class="btn-row">
  <button class="btn" id="btn-play">開始遊戲</button>
  <button class="btn alt" id="btn-shop">🛒 商店</button>
  <button class="btn ghost" id="btn-cloud">☁️ 雲端存檔</button>
  </div>
  <p class="stat hint" style="max-width:300px">滑動手指切水果！不要切到 💣<br>每關打倒 5 隻 Boss 就能解鎖下一關</p>
  <div id="daily" class="badge hidden"></div>
  <div id="version"></div>
</div>

<div id="nameset" class="screen hidden">
  <h2>歡迎！先取個暱稱吧 🍉</h2>
  <p class="stat">暱稱會和你的恢復碼一起存到雲端，<br>忘記恢復碼時，可以報暱稱請管理員幫你查。</p>
  <input class="field" id="name-input" maxlength="12" placeholder="你的暱稱" autocomplete="off">
  <div class="btn-row">
    <button class="btn" id="btn-name-ok">開始</button>
    <button class="btn ghost" id="btn-name-restore">🔑 我有恢復碼</button>
  </div>
</div>

<div id="cloud" class="screen hidden">
  <h2>☁️ 雲端存檔</h2>
  <div class="cloud-box">
    <p class="stat">暱稱：<b id="cloud-name"></b></p>
    <p class="stat">你的恢復碼（請截圖保存，刪除遊戲後可以用它找回進度）</p>
    <div id="cloud-code" class="code">—</div>
    <p class="stat" id="cloud-status"></p>
  </div>
  <div class="btn-row">
    <button class="btn alt" id="btn-copy-code">📋 複製恢復碼</button>
    <button class="btn ghost" id="btn-restore-open">🔑 輸入恢復碼</button>
  </div>
  <div id="restore-box" class="cloud-box hidden">
    <input class="field" id="restore-input" placeholder="FRUIT-XXXX-XXXX" maxlength="20" autocomplete="off" autocapitalize="characters">
    <button class="btn" id="btn-restore">恢復進度</button>
    <p class="stat" id="restore-msg"></p>
  </div>
  <button class="btn ghost" id="btn-cloud-back">返回</button>
  <p class="legal">雲端存檔受 reCAPTCHA 保護，適用 Google <a href="https://policies.google.com/privacy" target="_blank" rel="noopener">隱私權政策</a>與<a href="https://policies.google.com/terms" target="_blank" rel="noopener">服務條款</a>。</p>
</div>

<div id="stages" class="screen hidden">
  <h2>選擇關卡</h2>
  <div id="stage-list"></div>
  <button class="btn ghost" id="btn-stages-back">返回</button>
</div>

<div id="clear" class="screen hidden">
  <h1 class="title">過關！</h1>
  <p class="subtitle" id="clear-stage"></p>
  <div class="big-score" id="clear-score">0</div>
  <p class="stat">本局金幣 <b id="clear-coins">0</b></p>
  <div id="clear-unlock" class="badge hidden"></div>
  <div class="btn-row">
  <button class="btn" id="btn-next">下一關 ▶</button>
  <button class="btn alt" id="btn-clear-shop">🛒 商店</button>
  <button class="btn ghost" id="btn-clear-menu">主選單</button>
  </div>
</div>

<div id="shop" class="screen hidden">
  <h2>🛒 商店</h2>
  <p class="stat">金幣 <b id="shop-coins">0</b></p>
  <div class="tabs"><button class="tab active" data-tab="blades">🔪 刀具</button><button class="tab" data-tab="perks">⭐ 能力強化</button></div>
  <div id="shop-list"></div>
  <button class="btn ghost" id="btn-shop-back">返回</button>
</div>

<div id="pause" class="screen hidden">
  <h1 class="title">暫停</h1>
  <div class="btn-row">
  <button class="btn" id="btn-resume">繼續</button>
  <button class="btn ghost" id="btn-quit">回主選單</button>
  </div>
</div>

<div id="over" class="screen hidden">
  <h1 class="title">遊戲結束</h1>
  <div class="big-score" id="over-score">0</div>
  <div id="over-record" class="badge hidden">新紀錄！</div>
  <p class="stat">最高分 <b id="over-best">0</b>　本局金幣 <b id="over-coins">0</b></p>
  <div class="btn-row">
  <button class="btn" id="btn-again">再玩一次</button>
  <button class="btn alt" id="btn-over-shop">🛒 商店</button>
  <button class="btn ghost" id="btn-over-menu">主選單</button>
  </div>
</div>

<script src="firebase-config.js"></script>
<script>

// ===== 客製化：改這裡就能換成你們專屬的內容 =====

const FIREBASE_VERSION = '10.12.2';
const CODE_CHARS = '23456789ABCDEFGHJKLMNPQRSTUVWXYZ'; // 拿掉容易看錯的 0/O、1/I
const CODE_RE = /^FRUIT-[2-9A-HJ-NP-Z]{4}-[2-9A-HJ-NP-Z]{4}$/;
const CLOUD = { db: null, api: null, ready: false, state: 'off', lastSync: 0, timer: null, busy: false };
function newCode() {
  const r = crypto.getRandomValues(new Uint32Array(8));
  let s = 'FRUIT-';
  for (let i = 0; i < 8; i++) { s += CODE_CHARS[r[i] % 32]; if (i === 3) s += '-'; }
  return s;
}
async function cloudInit() {
  const cfg = window.FIREBASE_CONFIG;
  if (!cfg || !cfg.apiKey) { CLOUD.state = 'off'; return; }
  try {
    const app = await import(`https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/firebase-app.js`);
    const fs = await import(`https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/firebase-firestore.js`);
    const fbApp = app.initializeApp(cfg);
    if (window.RECAPTCHA_SITE_KEY) {
      const ac = await import(`https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/firebase-app-check.js`);
      CLOUD.appCheck = ac.initializeAppCheck(fbApp, { provider: new ac.ReCaptchaEnterpriseProvider(window.RECAPTCHA_SITE_KEY), isTokenAutoRefreshEnabled: true }); CLOUD.acApi = ac;
    }
    CLOUD.api = fs; CLOUD.db = fs.getFirestore(fbApp); CLOUD.ready = true; CLOUD.state = 'syncing';
    await cloudSync();
    if (CLOUD.state === 'syncing') CLOUD.state = 'ok'; // 還沒取暱稱時沒有東西要同步
  } catch (e) { CLOUD.state = 'offline'; }
  if (state === 'cloud') renderCloud();
}
function cloudSyncSoon() { clearTimeout(CLOUD.timer); CLOUD.timer = setTimeout(cloudSync, 2500); }
async function cloudSync() {
  if (!CLOUD.ready || !save.cloud || !save.cloud.code || CLOUD.busy) return;
  CLOUD.busy = true;
  const { doc, setDoc, serverTimestamp } = CLOUD.api;
  try {
    const { cloud, ...data } = save;
    await setDoc(doc(CLOUD.db, 'saves', cloud.code), {
      name: cloud.name, save: data, version: VERSION, updatedAt: serverTimestamp(),
      stats: { coins: save.coins, best: save.best, unlocked: save.unlocked, cleared: Object.keys(save.cleared || {}).length },
    });
    CLOUD.lastSync = Date.now(); CLOUD.state = 'ok';
  } catch (e) {
    // 離線或寫太快被限速擋下：10 秒後自動再試
    CLOUD.state = 'offline';
    clearTimeout(CLOUD.timer); CLOUD.timer = setTimeout(cloudSync, 10000);
  }

}
// 用恢復碼把雲端的進度載回這支手機（會覆蓋目前的進度）
async function cloudRestore(input) {
  const code = input.trim().toUpperCase().replace(/\s+/g, '').replace(/^FRUIT(?!-)/, 'FRUIT-').replace(/^(FRUIT-[^-]{4})(?!-)/, '$1-');
  if (!CODE_RE.test(code)) throw new Error('恢復碼格式不對，應該像 FRUIT-ABCD-2345');
  if (!CLOUD.ready) throw new Error('目前連不上雲端，請確認網路後再試一次');
  const { doc, getDoc } = CLOUD.api;
  const snap = await getDoc(doc(CLOUD.db, 'saves', code));
  if (!snap.exists()) throw new Error('找不到這組恢復碼，請再確認一次');
  const d = snap.data();
  save = Object.assign(defaultSave(), d.save, { cloud: { code, name: d.name } });
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {}
  return d.name;
}

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const spriteCache = new Map(), artCache = new Map();
let W = 0, H = 0, S = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight; S = Math.min(W, H);
  cv.width = W * DPR; cv.height = H * DPR;
  // 畫布在螢幕上的大小固定為視窗大小；高解析度手機（DPR 2～3）才不會被放大、點擊位置才會對
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  artCache.clear();
}
addEventListener('resize', resize);
resize();

function sprite(e, size) {
  size = Math.max(4, Math.round(size));
  const k = e + '|' + size;
  let c = spriteCache.get(k);
  if (c) return c;
  c = document.createElement('canvas');
  const px = Math.ceil(size * 1.4 * DPR);
  c.width = c.height = px;
  const g = c.getContext('2d');
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = (size * DPR) + 'px ' + EMOJI_FONT;
  g.fillText(e, px / 2, px / 2 + size * DPR * 0.06);
  c.logical = px / DPR;
  spriteCache.set(k, c);
  return c;
}
function drawSprite(e, size, x, y, rot = 0, alpha = 1) {
  const s = sprite(e, size), L = s.logical;
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x, y); if (rot) ctx.rotate(rot);
  ctx.drawImage(s, -L / 2, -L / 2, L, L); ctx.restore();
}

  r = Math.max(4, Math.round(r));

  c = document.createElement('canvas');

  g.translate(px / 2, px / 2); g.scale(DPR, DPR);

}
function drawArt(kind, id, r, x, y, rot = 0, alpha = 1) {

  ctx.drawImage(c, -L / 2, -L / 2, L, L); ctx.restore();
}
function radial(g, x, y, r0, r1, stops) {

let actx = null;
function audio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (actx && actx.state === 'suspended') actx.resume();
}
function noise(dur, freq, vol, type = 'highpass') {
  if (!actx) return;
  const n = actx.sampleRate * dur | 0, b = actx.createBuffer(1, n, actx.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = actx.createBufferSource(); s.buffer = b;
  const f = actx.createBiquadFilter(); f.type = type; f.frequency.value = freq;
  const g = actx.createGain(); g.gain.value = vol;
  s.connect(f).connect(g).connect(actx.destination); s.start();
}
function tone(f1, f2, dur, vol, type = 'sine', delay = 0) {
  if (!actx) return;
  const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + delay;
  o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur);
}

const gravity = () => H * 1.25;

function launch(kind, opts) {
  const r = S * 0.075;
  const o = { kind, x: W * (0.15 + Math.random() * 0.7), y: H + r, r, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 6, dead: false };
  const g = gravity(), peak = H * (0.45 + Math.random() * 0.35);
  o.vy = -Math.sqrt(2 * g * peak);
  const tx = W * (0.25 + Math.random() * 0.5);
  o.vx = (tx - o.x) / ((-o.vy / g) * 1.6);
  if (kind === 'fruit') { const f = FRUITS[Math.random() * FRUITS.length | 0]; o.f = f; o.art = f.id; o.r = r * (f.s || 1); }
  else if (kind === 'bomb') { o.art = 'bomb'; o.r = r * 0.95; }
  else if (kind === 'star') { o.e = '🌟'; o.r = r * 0.85; }
  else if (kind === 'heart') { o.e = '💗'; o.r = r * 0.85; }
  Object.assign(o, opts);
  G.objs.push(o);
  return o;
}
function pickKind(diff) {
  const r = Math.random(), bomb = (G.boss ? 0.05 : 0.07 + 0.11 * diff) * G.st.diff * (1 - 0.08 * perkLvl('bomb'));
  const star = 0.03 + 0.012 * perkLvl('star'), heart = 0.015 + 0.01 * perkLvl('heart');
  if (r < bomb) return 'bomb';
  if (r < bomb + star) return 'star';
  if (r < bomb + star + heart && G.hearts < MAX_HEARTS) return 'heart';

  }
  pts.push([x2, y2]);
  G.bolts.push({ pts, life: 0.25 + 0.1 * w, max: 0.25 + 0.1 * w, w });
}
function slash(x1, y1, x2, y2, color, w, life = 0.3, grow = false) { G.slashes.push({ x1, y1, x2, y2, color, w, life, max: life, grow }); }
// 穿過 (x, y)、角度 a、貫穿整個畫面的大刀光
function bigSlash(x, y, a, color, w, life = 0.6) {
  const L = Math.hypot(W, H);
  slash(x - Math.cos(a) * L, y - Math.sin(a) * L, x + Math.cos(a) * L, y + Math.sin(a) * L, color, w, life, true);
}

// ===== 切水果 =====
function segDist(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, l = dx * dx + dy * dy;
  let t = l ? ((px - ax) * dx + (py - ay) * dy) / l : 0;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(ax + t * dx - px, ay + t * dy - py);
}

// off：刀痕離水果中心的距離（沿刀痕法線方向），水果會沿著實際刀痕切開
function makeHalves(o, ang, off = 0, col = '#fff', force = 1) {
  const nx = -Math.sin(ang), ny = Math.cos(ang);
  off = Math.max(-o.r * 0.65, Math.min(o.r * 0.65, off));
  for (const side of [-1, 1]) {
    const cy = side < 0 ? (off - o.r) / 2 : (off + o.r) / 2; // 這一塊的重心
    const push = S * 0.35 * force * Math.min(1.8, Math.max(0.35, Math.abs(cy) / (o.r * 0.5))); // 小塊飛得比較遠
    G.pieces.push({ e: o.e, art: o.art, size: o.r * 2, r: o.r, col, off, cy, x: o.x + nx * cy, y: o.y + ny * cy, ph: Math.random() * 6,
      vx: o.vx * 0.4 + nx * side * push, vy: o.vy * 0.4 + ny * side * push,
      c: ang, r0: o.rot, d: 0, vd: side * (2 + Math.random() * 3), side });
  }
}

function addCoins(n) {
  const v = n * (1 + 0.08 * perkLvl('coin')) + G.coinFrac, w = Math.floor(v + 1e-9);
  G.coinFrac = v - w; save.coins += w; G.coinsEarned += w;
  return w;
}

function hitObj(o, ang, byEffect, off = 0) {
  if (o.dead) return;
  if (o.kind === 'bomb') { if (!byEffect && !G.fin) explodeBomb(o); return; }
  o.dead = true;
  const col = o.f ? o.f.c : o.kind === 'heart' ? '#ff5c8a' : '#ffd166';
  makeHalves(o, ang, off, col);
  juice(o.x, o.y, col);
  splat(o.x, o.y, col, o.r);
  G.score += 1;
  addCoins(coinMult());
  G.strokeCount++;
  if (o.kind === 'star') { const c = addCoins(5 * coinMult()); text(o.x, o.y, `+${c} 💰`, '#ffd166'); sfx.coin(); }
  if (o.kind === 'heart') { G.hearts = Math.min(MAX_HEARTS, G.hearts + 1); text(o.x, o.y, '+❤️', '#ff5c8a'); sfx.coin(); }
  sfx.slice();
  if (!byEffect) bladeEffect(o);
  updateHUD();
}

function nearestFruit(x, y, maxD = Infinity) {
  let best = null, bd = maxD;
  for (const t of G.objs) { if (t.dead || t.kind === 'bomb') continue; const d = Math.hypot(t.x - x, t.y - y); if (d < bd) { bd = d; best = t; } }
  return best;
}

function bladeEffect(o) {
  const b = blade(), lvl = bladeLvl();
  if (b.id === 'fire') {
    const R = S * (0.14 + 0.035 * lvl);
    ring(o.x, o.y, R, '#ff9f1c'); juice(o.x, o.y, '#ff6a00', 18, 1.3); sfx.boom();
    for (const t of G.objs) if (!t.dead && t.kind !== 'bomb' && Math.hypot(t.x - o.x, t.y - o.y) < R + t.r) hitObj(t, Math.random() * 6, true);
  } else if (b.id === 'ice') {
    emojiBurst(o.x, o.y, '❄️', 3, S * 0.03);
    if (Math.random() < 0.12 + 0.05 * lvl) {
      if (G.slowT <= 0) { text(W / 2, H * 0.45, '❄️ 時間減慢！', '#a8e6ff', 0.08, 1.2); sfx.freeze(); }
      G.slowT = Math.max(G.slowT, 1.2 + 0.3 * lvl);
    }
  } else if (b.id === 'sakura') {
    for (let i = 0; i < 3; i++) addPart({ x: o.x, y: o.y, vx: (Math.random() - 0.5) * S * 0.6, vy: -S * 0.3 * Math.random(), life: 0.8, max: 0.8, kind: 'petal', color: '#ffb3c6', size: S * 0.012, g: 0.15, rot: Math.random() * 6 });
    if (Math.random() < 0.4 + 0.08 * lvl) for (let i = 0; i < (lvl >= 3 ? 2 : 1); i++) addHomer(o.x, o.y, false);
  } else if (b.id === 'thunder') {
    if (Math.random() < 0.6 + 0.08 * lvl) {
      let from = o;
      for (let i = 0; i < lvl; i++) {
        const best = nearestFruit(from.x, from.y, S * 0.6);
        if (!best) break;
        bolt(from.x, from.y, best.x, best.y); hitObj(best, Math.random() * 6, true); from = best;
      }
      if (from !== o) sfx.zap();
    }
  } else if (b.id === 'wind') {
    for (let i = 0; i < 5; i++) addPart({ x: o.x, y: o.y, vx: (Math.random() - 0.5) * S * 1.6, vy: (Math.random() - 0.5) * S * 0.3, life: 0.3, max: 0.3, kind: 'streak', color: '#d8f3dc', size: S * 0.004, g: 0 });
  } else if (b.id === 'shadow') {
    if (Math.random() < 0.2 + 0.07 * lvl) {
      const cands = G.objs.filter(t => !t.dead && t.kind !== 'bomb' && t !== o);
      if (cands.length) {
        const t = cands[Math.random() * cands.length | 0], a = Math.random() * Math.PI, dx = Math.cos(a) * t.r * 1.8, dy = Math.sin(a) * t.r * 1.8;
        slash(t.x - dx, t.y - dy, t.x + dx, t.y + dy, '#9d4edd', S * 0.014, 0.35);
        for (let i = 0; i < 4; i++) addPart({ x: t.x, y: t.y, vx: (Math.random() - 0.5) * S * 0.4, vy: (Math.random() - 0.5) * S * 0.4, life: 0.5, max: 0.5, kind: 'ghost', color: '#3c096c', size: S * 0.04, g: 0 });
        hitObj(t, a, true);
      }
    }
  } else if (b.id === 'love') {
    emojiBurst(o.x, o.y, '💕', 3, S * 0.035);
    if (Math.random() < 0.03 * lvl && G.hearts < MAX_HEARTS) { G.hearts++; text(o.x, o.y - o.r, '+❤️', '#ff5c8a'); }
  } else if (b.id === 'galaxy') {
    emojiBurst(o.x, o.y, '✨', 2, S * 0.03);
    if (Math.random() < 0.03 * lvl) launch('star', { x: o.x, y: o.y, vx: (Math.random() - 0.5) * S * 0.6, vy: -H * 0.9, thrown: true });
  } else if (b.id === 'dragon') {
    juice(o.x, o.y, '#ffd60a', 6, 1.2);
    if (Math.random() < 0.05 + 0.02 * lvl) dragonBreath(o.y);
  }
}

// 櫻花刀：會自動追蹤水果（或 Boss）的花瓣
function addHomer(x, y, toBoss) { G.homers.push({ x, y, vx: (Math.random() - 0.5) * S, vy: -S * 0.6, life: 2.2, toBoss, rot: 0, target: null }); }
function updateHomers(dt) {
  const lvl = bladeLvl();
  for (const h of G.homers) {
    h.life -= dt; h.rot += dt * 8;
    let tx = null, ty = null, tr = 0;
    if (h.toBoss && G.boss && !G.fin) { tx = G.boss.x; ty = G.boss.y; tr = G.boss.r; }
    else {
      if (!h.target || h.target.dead) h.target = nearestFruit(h.x, h.y);
      if (h.target) { tx = h.target.x; ty = h.target.y; tr = h.target.r * 0.8; }
    }
    if (tx !== null) {
      const d = Math.hypot(tx - h.x, ty - h.y) || 1, sp = S * 1.7;
      h.vx += ((tx - h.x) / d * sp - h.vx) * Math.min(1, dt * 6);
      h.vy += ((ty - h.y) / d * sp - h.vy) * Math.min(1, dt * 6);
      if (d < tr) {
        h.life = 0;
        if (h.toBoss && G.boss) damageBoss(+(0.3 * lvl).toFixed(1));
        else if (h.target) hitObj(h.target, Math.atan2(h.vy, h.vx), true);
      }
    }
    h.x += h.vx * dt; h.y += h.vy * dt;
    if (Math.random() < 0.3) addPart({ x: h.x, y: h.y, vx: 0, vy: 0, life: 0.3, max: 0.3, kind: 'petal', color: '#ffc8dd', size: S * 0.007, g: 0.1, rot: h.rot });
  }
  G.homers = G.homers.filter(h => h.life > 0);
}

// 龍神刀：龍息從左橫掃到右，燒掉這一排的水果
function dragonBreath(y) {
  G.beams.push({ y, t: 0, dur: 0.75, hitBoss: false });
  text(W / 2, y - S * 0.12, '🐉 龍息！', '#ffd60a', 0.07, 1);
  sfx.boom(); tone(220, 60, 0.7, 0.2, 'sawtooth'); G.shake = Math.max(G.shake, 0.4);
}
function updateBeams(rdt) {
  for (const bm of G.beams) {
    bm.t += rdt;
    const head = -S * 0.2 + (W + S * 0.4) * Math.min(1, bm.t / 0.45), band = S * 0.13;
    bm.head = head;
    for (const o of G.objs) if (!o.dead && o.kind !== 'bomb' && o.x < head && Math.abs(o.y - bm.y) < band + o.r * 0.5) hitObj(o, 0, true);
    const b = G.boss;
    if (b && !bm.hitBoss && !G.fin && head > b.x && Math.abs(b.y - bm.y) < b.r + band) { bm.hitBoss = true; damageBoss(3 + bladeLvl()); }
    if (bm.t < 0.45) for (let i = 0; i < 3; i++) addPart({ x: head, y: bm.y + (Math.random() - 0.5) * band * 2, vx: -S * (0.3 + Math.random() * 0.5), vy: (Math.random() - 0.5) * S * 0.3, life: 0.5, max: 0.5, color: ['#fff3b0', '#ffd60a', '#ff6a00', '#d00000'][Math.random() * 4 | 0], size: S * (0.01 + Math.random() * 0.015), g: -0.1, rt: true });
  }
  G.beams = G.beams.filter(bm => bm.t < bm.dur);
}

function explodeBomb(o) {
  o.dead = true;
  ring(o.x, o.y, S * 0.35, '#ffffff', 0.4);
  juice(o.x, o.y, '#ffb703', 24, 1.6); juice(o.x, o.y, '#333', 16, 1.2);
  G.flash = 0.35; G.flashColor = '#fff'; G.shake = 0.45;
  sfx.bomb(); buzz(250);
  text(o.x, o.y, '-❤️', '#ff4d6d', 0.08);
  loseHeart();
}

function loseHeart() {
  if (G.overT > 0 || G.done) return;
  G.hearts--;
  updateHUD();
  if (G.hearts <= 0) G.overT = 1.0;
}

function missFruit(o) {
  const x = Math.max(30, Math.min(W - 30, o.x));
  text(x, H - S * 0.08, '✖', '#ff4d6d', 0.09);
  sfx.miss(); buzz(60);
  loseHeart();
}

function handleSegment(ax, ay, bx, by, dtms) {
  const len = Math.hypot(bx - ax, by - ay);
  if (len < 2 || len / dtms < 0.2) return;
  const ang = Math.atan2(by - ay, bx - ax);
  const nx = -Math.sin(ang), ny = Math.cos(ang), hr = HIT_RADIUS * hitMul();
  // 判定範圍比圖示小一圈：刀要真的劃過水果本體才算，旁邊靠很近的水果不會被誤切
  for (const o of G.objs) {
    if (o.dead || segDist(o.x, o.y, ax, ay, bx, by) >= o.r * hr) continue;
    hitObj(o, ang, false, (ax - o.x) * nx + (ay - o.y) * ny);
  }
  const b = G.boss;
  if (b && !b.enter && !b.fin && b.hitCd <= 0 && segDist(b.x, b.y, ax, ay, bx, by) < b.r) {
    b.hitCd = 0.12;
    damageBoss(dmgOf(blade(), bladeLvl()));
    bossBladeEffect(b);
  }
}

// ===== Boss =====
function spawnBoss() {
  const i = G.bossIndex, def = G.st.bosses[i], hp = Math.round(BOSS_HP[i] * G.st.hpMul);
  G.boss = { def, name: def.name, hp, maxHp: hp, x: W / 2, y: -S * 0.3, r: S * 0.14, t: 0, enter: true, atkT: 2.5, hitCd: 0,
    flash: 0, burn: 0, burnDps: 0, slow: 0, fin: false, hidden: false, windup: 0, windupMax: 1, plan: null };
  G.bfx = { type: def.fx, color: def.color, k: 0, parts: [], t: 0, out: false, acc: 0, light: 0 };
  G.warnT = 2.2;
  sfx.boss(); buzz(200);
  document.getElementById('boss-name').textContent = `👑 ${def.name}（${i + 1}/5）`;
  document.getElementById('boss-bar').classList.remove('hidden');
  updateBossBar(); updateHUD();
}
function updateBossBar() {
  const b = G.boss; if (!b) return;
  document.getElementById('boss-hp').style.width = Math.max(0, b.hp / b.maxHp * 100) + '%';
}
function damageBoss(n, silent) {
  const b = G.boss; if (!b || b.fin) return;
  b.hp -= n;
  if (!silent) {
    b.flash = 0.1; sfx.hit(); buzz(15);
    juice(b.x + (Math.random() - 0.5) * b.r, b.y + (Math.random() - 0.5) * b.r, b.def.color, 8);
    text(b.x + (Math.random() - 0.5) * b.r, b.y - b.r * 0.6, '-' + n, '#fff', 0.055, 0.6);
  }
  if (b.hp <= 0) { b.hp = 0; startFinisher(b); }
  updateBossBar();
}
function bossBladeEffect(b) {
  const id = blade().id, lvl = bladeLvl(), dmg = dmgOf(blade(), lvl);
  if (id === 'fire') { b.burn = 2; b.burnDps = 0.4 * lvl; ring(b.x, b.y, b.r * 1.3, '#ff9f1c'); }
  else if (id === 'ice') { b.slow = 1 + 0.2 * lvl; emojiBurst(b.x, b.y, '❄️', 4, S * 0.035); }
  else if (id === 'sakura') { if (Math.random() < 0.5) addHomer(b.x + (Math.random() - 0.5) * b.r * 2, b.y + b.r * 1.5, true); }
  else if (id === 'thunder') {
    if (Math.random() < 0.3) { bolt(b.x + (Math.random() - 0.5) * S * 0.3, 0, b.x, b.y); sfx.zap(); damageBoss(+(1 + 0.5 * lvl).toFixed(1)); G.flash = 0.12; G.flashColor = '#fff7b0'; }
  } else if (id === 'wind') {
    if (Math.random() < 0.1 + 0.05 * lvl) { slash(b.x - b.r * 1.8, b.y + b.r * 0.3, b.x + b.r * 1.8, b.y - b.r * 0.3, '#95d5b2', S * 0.014, 0.3); damageBoss(+(dmg * 0.6).toFixed(1)); }
  } else if (id === 'shadow') {
    if (Math.random() < 0.3) {
      const d = b.r * 1.3;
      slash(b.x - d, b.y - d, b.x + d, b.y + d, '#9d4edd', S * 0.016, 0.35); slash(b.x + d, b.y - d, b.x - d, b.y + d, '#9d4edd', S * 0.016, 0.35);
      damageBoss(dmg);
    }
  } else if (id === 'love') {
    emojiBurst(b.x, b.y, '💖', 2, S * 0.04);
    if (Math.random() < 0.02 * lvl && G.hearts < MAX_HEARTS) { G.hearts++; text(b.x, b.y + b.r, '+❤️', '#ff5c8a'); updateHUD(); }
  } else if (id === 'galaxy') {
    if (Math.random() < 0.2) {
      slash(b.x + S * 0.6, b.y - S * 0.9, b.x, b.y, '#a0c4ff', S * 0.018, 0.35, true);
      ring(b.x, b.y, b.r * 1.5, '#cdb4db', 0.4); burst(b.x, b.y, 'dot', 12, ['#ffffff', '#a0c4ff', '#ffd166'], 0.6, 0.006, 0.6);
      damageBoss(+(2 + 0.5 * lvl).toFixed(1));
    }
  } else if (id === 'dragon') {
    if (Math.random() < 0.15) dragonBreath(b.y);
  }
}
// Boss 攻擊分兩段：先蓄力預告（停住、發紅光、畫出炸彈落點軌跡），時間到才真的丟出去
function bossWindup(b, phase2) {
  const bombs = phase2 ? 2 : 1, fruits = 2, plan = [];
  const add = kind => plan.push({ kind, vx: (Math.random() - 0.5) * W * 0.9, vy: -H * (0.25 + Math.random() * 0.35) });
  for (let i = 0; i < bombs; i++) add('bomb');
  for (let i = 0; i < fruits; i++) add('fruit');
  b.plan = plan;
  b.windup = b.windupMax = phase2 ? 0.9 : 1.2;
  tone(880, 880, 0.12, 0.08, 'square'); tone(880, 880, 0.12, 0.08, 'square', 0.25);
}
function bossRelease(b) {
  for (const p of b.plan) {
    const o = launch(p.kind, { thrown: true });
    o.x = b.x; o.y = b.y + b.r * 0.4; o.vx = p.vx; o.vy = p.vy;
  }
  b.plan = null;
  b.flash = 0.15;
  noise(0.15, 900, 0.2, 'bandpass');
}
function bombPath(b, p) {
  const pts = [], g = gravity(), x0 = b.x, y0 = b.y + b.r * 0.4;
  for (let t = 0.08; t < 3; t += 0.07) {
    const x = x0 + p.vx * t, y = y0 + p.vy * t + 0.5 * g * t * t;
    if (y > H + 20 || x < -20 || x > W + 20) break;
    if (Math.hypot(x - b.x, y - b.y) > b.r * 1.05) pts.push([x, y]); // 不畫在 Boss 身上
  }
  return pts;
}
function finishBoss() {
  const b = G.boss, i = G.bossIndex;
  // 每隻 Boss 第一次打倒給 3 倍獎勵，之後重刷只給基本額（鼓勵往後推進，不是一直刷同一關）
  save.bossFirst = save.bossFirst || {};
  const key = G.stage + '-' + i, first = !save.bossFirst[key];
  save.bossFirst[key] = true;
  const reward = Math.round(20 * (i + 1) * (1 + G.stage * 0.6) * (first ? 3 : 1) * coinMult());
  const got = addCoins(reward); G.score += 20;
  // 打倒 Boss 回復兩顆愛心
  const heal = Math.min(2, MAX_HEARTS - G.hearts);
  if (heal > 0) { G.hearts += heal; text(W / 2, H * 0.42 + S * 0.2, '+' + '❤️'.repeat(heal), '#ff5c8a', 0.07, 1.8); }
  emojiBurst(W / 2, H * 0.45, '💰', 10, S * 0.05, 0.9);
  text(W / 2, H * 0.42, first ? `首次擊敗 ${b.name}！獎勵 ×3` : `擊敗 ${b.name}！`, '#ffd166', 0.08, 1.8);
  text(W / 2, H * 0.42 + S * 0.1, `+${got} 💰`, '#fff', 0.07, 1.8);
  sfx.win();
  G.bossIndex++;
  G.boss = null;
  if (G.bfx) G.bfx.out = true;
  document.getElementById('boss-bar').classList.add('hidden');
  if (G.bossIndex >= G.st.bosses.length) {
    G.done = true; G.clearT = 2.4;
    text(W / 2, H * 0.6, '🎉 關卡完成！', '#ffffff', 0.09, 2.4);
  } else G.nextBoss = G.score + (BOSS_AT[G.bossIndex] - BOSS_AT[G.bossIndex - 1]);
  persist();
  updateHUD();
}

// ===== 擊殺技：每把刀打倒 Boss 時的專屬特效 =====
const FIN_COLOR = { basic: '#ffffff', fire: '#ff9f1c', ice: '#e0fbfc', sakura: '#ffc8dd', thunder: '#fff3a0', wind: '#d8f3dc',
  shadow: '#240046', love: '#ffc2d1', galaxy: '#ffffff', dragon: '#ffd60a' };
function startFinisher(b) {
  const bl = blade();
  b.fin = true; b.windup = 0; b.plan = null; b.burn = 0;
  G.fin = { id: bl.id, name: bl.finisher, icon: bl.icon, t: 0, dur: 2.7, brk: 1.25, broke: false, x: b.x, y: b.y, r: b.r, ev: 0, seed: Math.random() * 1e6 | 0 };
  // 場上的炸彈全部無害化，不會在播特效時被炸到
  for (const o of G.objs) if (o.kind === 'bomb') { o.dead = true; burst(o.x, o.y, 'dot', 8, ['#555', '#999'], 0.4, 0.008, 0.5); }
  G.homers = [];
  G.warnT = 0;
  tone(150, 900, 0.9, 0.12, 'sawtooth'); noise(0.9, 500, 0.15, 'bandpass');
  buzz([60, 40, 60]);
}
function breakBoss(ang) {
  const f = G.fin, b = G.boss;
  f.broke = true; b.hidden = true;
  makeHalves({ x: b.x, y: b.y, r: b.r, vx: 0, vy: -S * 0.3, rot: Math.sin(b.t * 2) * 0.12, art: b.def.skin }, ang, 0, b.def.color, 2.2);
  for (let i = 0; i < 3; i++) juice(b.x, b.y, i ? b.def.color : '#ffffff', 22, 2.2);
  splat(b.x, b.y, b.def.color, b.r * 1.4);
  G.shake = 1.2; G.flash = 0.28; G.flashColor = FIN_COLOR[f.id];
  sfx.bomb(); tone(90, 40, 0.8, 0.3, 'sawtooth'); buzz([120, 50, 220]);

// ===== 更新 =====
function update(rdt) {
  G.time += rdt;
  G.slowT -= rdt;
  const target = G.fin ? 0.22 : G.slowT > 0 ? 0.4 : 1;
  G.timeScale += (target - G.timeScale) * Math.min(1, rdt * 6);
  const dt = rdt * G.timeScale, g = gravity();

  if (G.overT > 0) { G.overT -= rdt; if (G.overT <= 0) { gameOver(); return; } }
  if (G.clearT > 0) { G.clearT -= rdt; if (G.clearT <= 0) { stageClear(); return; } }
  if (G.fin) { updateFinisher(G.fin, rdt); if (G.fin.t >= G.fin.dur) { G.fin = null; finishBoss(); } }

  // 生成
  if (!G.boss && !G.done && G.score >= G.nextBoss) spawnBoss();
  if (G.warnT > 0) G.warnT -= rdt;
  G.spawnT -= dt;
  if (G.spawnT <= 0 && G.overT <= 0 && !G.done && !G.fin) {
    // 難度慢慢上升（400 分才到最難）；一次最多 3 顆，最後一關最多 4 顆，而且一顆一顆錯開飛出來
    const diff = Math.min(1, G.score / 400);
    G.spawnT = (1.9 - 0.6 * diff) / (1 + (G.st.diff - 1) * 0.5) * (G.boss ? 1.8 : 1);
    const n = 1 + Math.floor(Math.random() * (1 + diff * 2 + (G.st.diff - 1)));
    for (let i = 0; i < n; i++) G.pending.push({ t: i * 0.28, kind: pickKind(diff) });
  }
  for (const p of G.pending) { p.t -= dt; if (p.t <= 0) { launch(p.kind); p.done = true; } }
  G.pending = G.pending.filter(p => !p.done);

  // 物件
  for (const o of G.objs) {
    o.vy += g * dt; o.x += o.vx * dt; o.y += o.vy * dt; o.rot += o.vr * dt;
    // 引信尖端（跟著炸彈旋轉）冒火花
    const fx = 0.32 * o.r, fy = -1.32 * o.r, cr = Math.cos(o.rot), sr = Math.sin(o.rot);
    if (o.kind === 'bomb' && Math.random() < 0.7) addPart({ x: o.x + fx * cr - fy * sr, y: o.y + fx * sr + fy * cr, vx: (Math.random() - 0.5) * S * 0.2, vy: -S * 0.2, life: 0.3, max: 0.3, color: Math.random() < 0.5 ? '#ffd166' : '#ff6a00', size: S * 0.006, g: 0 });
    if (o.y > H + o.r * 2.5 && o.vy > 0) { o.dead = true; if (o.kind === 'fruit' && !o.thrown && !G.fin && !G.done) missFruit(o); }
    if (o.x < -o.r * 3 || o.x > W + o.r * 3) o.dead = true;
  }
  G.objs = G.objs.filter(o => !o.dead);

  updateHomers(dt);
  updateBeams(rdt);
  for (const p of G.pieces) { const pd = p.r > S * 0.1 ? rdt * 0.6 : dt; p.vy += g * pd; p.x += p.vx * pd; p.y += p.vy * pd; p.d += p.vd * pd; }
  G.pieces = G.pieces.filter(p => p.y < H + S * 0.4);
  for (const p of G.parts) {
    const pd = p.rt ? rdt : dt;
    if (p.orbit) {
      const o = p.orbit; o.ang += o.spd * rdt; o.rad *= Math.max(0, 1 - o.shrink * rdt);
      p.x = o.cx + Math.cos(o.ang) * o.rad; p.y = o.cy + Math.sin(o.ang) * o.rad; p.rot = o.ang;
    } else { p.vy += g * p.g * pd; p.x += p.vx * pd; p.y += p.vy * pd; if (p.rot !== undefined) p.rot += pd * 3; }
    p.life -= rdt;
  }
  G.parts = G.parts.filter(p => p.life > 0);
  for (const s of G.splats) { s.life -= rdt; for (const d of s.drips) d.len = Math.min(d.max, d.len + s.r * 0.5 * rdt); }
  G.splats = G.splats.filter(s => s.life > 0);
  for (const a of [G.rings, G.bolts, G.texts, G.slashes]) for (const x of a) { x.life -= rdt; if (a === G.texts) x.y -= S * 0.12 * rdt; }
  G.rings = G.rings.filter(x => x.life > 0); G.bolts = G.bolts.filter(x => x.life > 0);
  G.texts = G.texts.filter(x => x.life > 0); G.slashes = G.slashes.filter(x => x.life > 0);
  G.shake = Math.max(0, G.shake - rdt * 1.5);
  G.flash = Math.max(0, G.flash - rdt);
  if (G.bfx) { updateBossFx(G.bfx, rdt); if (G.bfx.out && G.bfx.k < 0.02) G.bfx = null; }

  // Boss
  const b = G.boss;
  if (b && !b.fin) {
    b.r = S * 0.14;
    const bs = b.slow > 0 ? 0.45 : 1;
    b.slow -= dt; b.hitCd -= rdt; b.flash -= rdt;
    if (b.windup > 0) {
      // 蓄力中：Boss 停在原地，讓預告的軌跡準確
      b.windup -= dt * bs;
      if (b.windup <= 0) { b.windup = 0; bossRelease(b); }
    } else {
      b.t += dt * bs;
      const tx = W / 2 + Math.sin(b.t * 0.9) * W * 0.28, ty = H * 0.3 + Math.sin(b.t * 1.7) * H * 0.07;
      const k = Math.min(1, dt * (b.enter ? 2 : 3));
      b.x += (tx - b.x) * k; b.y += (ty - b.y) * k;
      if (b.enter && Math.abs(b.y - ty) < 6) b.enter = false;
      const phase2 = b.hp < b.maxHp / 2;
      b.atkT -= dt * bs;
      if (b.atkT <= 0 && !b.enter) { b.atkT = phase2 ? 1.6 : 2.6; bossWindup(b, phase2); }
    }
    if (b.burn > 0) {
      b.burn -= dt; damageBoss(b.burnDps * dt, true);
      if (Math.random() < 0.5) addPart({ x: b.x + (Math.random() - 0.5) * b.r * 1.4, y: b.y + b.r * 0.3, vx: 0, vy: -S * 0.4, life: 0.4, max: 0.4, color: Math.random() < 0.5 ? '#ff9f1c' : '#ff4d00', size: S * 0.012, g: 0 });
    }
  }
}

// ===== 繪圖 =====
function drawMenuBackground(now) {
  const gr = ctx.createRadialGradient(W / 2, H * 0.4, S * 0.1, W / 2, H * 0.5, Math.max(W, H) * 0.8);
  gr.addColorStop(0, '#4a1d4f'); gr.addColorStop(0.6, '#2a0f33'); gr.addColorStop(1, '#14081a');
  ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
  for (const h of bgHearts) {
    h.y -= h.v * 0.016; if (h.y < -0.1) { h.y = 1.1; h.x = Math.random(); }
    drawSprite('💗', S * 0.06 * h.s, h.x * W + Math.sin(now / 1000 + h.x * 10) * 10, h.y * H, 0, 0.07);
  }
}

function heartPath(x, y, s) {
  ctx.beginPath(); ctx.moveTo(x, y + s * 0.35);
  ctx.bezierCurveTo(x - s * 1.1, y - s * 0.35, x - s * 0.55, y - s * 1.05, x, y - s * 0.5);
  ctx.bezierCurveTo(x + s * 0.55, y - s * 1.05, x + s * 1.1, y - s * 0.35, x, y + s * 0.35);
  ctx.closePath();
}

// 擊殺技：畫在水果和 Boss 底下的部分（壓暗畫面、星空等）
function drawFinisherUnder(f, now) {
  const t = f.t, a = t < f.brk ? Math.min(1, t / 0.3) : Math.max(0, 1 - (t - f.brk) / 0.9);
  const dark = { shadow: 0.85, galaxy: 0.75, thunder: 0.65 }[f.id] || 0.45;
  ctx.globalAlpha = dark * a; ctx.fillStyle = f.id === 'shadow' ? '#0a0014' : '#000'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1;
  if (f.id === 'galaxy') {
    const R = rng(f.seed + 1);
    for (let i = 0; i < 120; i++) {
      const x = R() * W, y = R() * H, tw = 0.4 + 0.6 * Math.abs(Math.sin(now / 300 + i));
      ctx.globalAlpha = a * tw; ctx.fillStyle = i % 7 ? '#ffffff' : '#a0c4ff'; circle(x, y, R() * 1.8 + 0.4);
    }
    ctx.globalAlpha = a * 0.5;
    ctx.fillStyle = radial(ctx, f.x, f.y, 0, S * 0.7, [[0, 'rgba(123,44,191,0.6)'], [1, 'rgba(58,12,163,0)']]); ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }
  if (f.id === 'love' && t < f.brk + 0.3) {
    const s = f.r * (1.6 + Math.sin(now / 90) * 0.12) * (0.6 + Math.min(1, t / f.brk) * 0.8);
    ctx.globalAlpha = 0.5 * a; ctx.fillStyle = radial(ctx, f.x, f.y, 0, s * 1.4, [[0, 'rgba(255,92,138,0.9)'], [1, 'rgba(255,92,138,0)']]);
    heartPath(f.x, f.y + s * 0.2, s); ctx.fill(); ctx.globalAlpha = 1;
  }
  if (f.id === 'thunder' && t < f.brk) {
    ctx.globalAlpha = 0.3 * a; ctx.fillStyle = radial(ctx, f.x, f.y, 0, S * 0.5, [[0, 'rgba(255,243,160,0.7)'], [1, 'rgba(255,243,160,0)']]); ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1;
  }
}

// 擊殺技：畫在最上層的部分（火柱、冰刺、龍、超新星、招式名稱）
function drawFinisherOver(f, now) {
  const t = f.t, k = Math.min(1, t / f.brk), after = t - f.brk;
  const { x, y, r } = f;
  ctx.save();
  if (f.id === 'fire' && after > 0 && after < 0.9) {
    const w = r * 2.4 * (1 - after / 0.9 * 0.6), fl = 1 + Math.sin(now / 30) * 0.06;
    const gr = ctx.createLinearGradient(x - w, 0, x + w, 0);
    gr.addColorStop(0, 'rgba(255,77,0,0)'); gr.addColorStop(0.3, 'rgba(255,120,0,0.8)'); gr.addColorStop(0.5, 'rgba(255,250,200,1)');
    gr.addColorStop(0.7, 'rgba(255,120,0,0.8)'); gr.addColorStop(1, 'rgba(255,77,0,0)');
    ctx.globalAlpha = 1 - after / 0.9; ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = gr;
    ctx.fillRect(x - w * fl, 0, w * 2 * fl, H);
  }
  if (f.id === 'ice') {
    if (t < f.brk) {
      ctx.strokeStyle = '#e0fbfc'; ctx.lineCap = 'round';
      for (let i = 0; i < 14; i++) {
        const a = i / 14 * Math.PI * 2 + 0.2, len = r * (0.9 + k * (0.7 + (i % 3) * 0.25));
        ctx.globalAlpha = 0.9; ctx.lineWidth = S * 0.012 * (1 - (i % 2) * 0.4);
        ctx.beginPath(); ctx.moveTo(x + Math.cos(a) * r * 0.7, y + Math.sin(a) * r * 0.7); ctx.lineTo(x + Math.cos(a) * len, y + Math.sin(a) * len); ctx.stroke();
      }
    }
    const fa = t < f.brk ? k : Math.max(0, 1 - after / 0.8);
    ctx.globalAlpha = 0.7 * fa;
    ctx.fillStyle = radial(ctx, W / 2, H / 2, Math.min(W, H) * 0.25, Math.max(W, H) * 0.75, [[0, 'rgba(224,251,252,0)'], [1, 'rgba(202,240,248,0.95)']]);
    ctx.fillRect(0, 0, W, H);
  }
  if (f.id === 'wind' && t < f.brk) {
    ctx.strokeStyle = '#d8f3dc'; ctx.lineCap = 'round';
    for (let i = 0; i < 6; i++) {
      const rad = r * (2.4 - k * 1.2) + i * 4, a0 = now / 120 + i * 1.05;
      ctx.globalAlpha = 0.75; ctx.lineWidth = S * 0.008;
      ctx.beginPath(); ctx.arc(x, y, rad, a0, a0 + 1.6); ctx.stroke();
    }
  }
  if (f.id === 'galaxy' && after > 0 && after < 0.9) {
    const rad = r * (1 + after * 9);
    ctx.globalAlpha = 1 - after / 0.9; ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = radial(ctx, x, y, 0, rad, [[0, 'rgba(255,255,255,1)'], [0.3, 'rgba(160,196,255,0.8)'], [0.7, 'rgba(123,44,191,0.4)'], [1, 'rgba(58,12,163,0)']]);
    circle(x, y, rad);
  }
  if (f.id === 'dragon' && t < f.brk + 0.35) {
    // 龍身：一串金色鱗片圓，從尾巴到頭越來越粗
    for (let i = 26; i >= 0; i--) {
      const p = dragonHead(f, i * 0.022);
      if (p.u < 0) continue;
      const rr = r * 0.32 * (1 - i / 34);
      ctx.globalAlpha = 1;
      ctx.fillStyle = radial(ctx, p.x - rr * 0.3, p.y - rr * 0.3, 0, rr, [[0, '#fff3b0'], [0.5, '#ffd60a'], [1, '#b8860b']]);
      circle(p.x, p.y, rr);
      if (i % 3 === 0) { ctx.fillStyle = '#e85d04'; ctx.beginPath(); ctx.moveTo(p.x - rr * 0.5, p.y - rr * 0.8); ctx.lineTo(p.x, p.y - rr * 1.6); ctx.lineTo(p.x + rr * 0.5, p.y - rr * 0.8); ctx.fill(); }
    }
    const hd = dragonHead(f), nx = dragonHead(f, -0.02);
    drawSprite('🐲', r * 1.3, hd.x, hd.y, Math.atan2(nx.y - hd.y, nx.x - hd.x) * 0.5);
  }
  ctx.restore();

  // 招式名稱
  if (t > 0.05 && t < f.dur) {
    const appear = Math.min(1, (t - 0.05) / 0.25), fade = Math.min(1, (f.dur - t) / 0.4);
    const sc = 1 + (1 - appear) * 1.5, size = S * 0.1 * sc;
    const ty = Math.min(H * 0.72, y + r * 2.6);
    ctx.save();
    ctx.globalAlpha = appear * fade;
    ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(0, ty - S * 0.09, W, S * 0.18);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `900 ${size}px ${FONT}`;
    const label = `${f.name}！`;
    const gr = ctx.createLinearGradient(0, ty - size / 2, 0, ty + size / 2);
    gr.addColorStop(0, '#ffffff'); gr.addColorStop(0.5, FIN_COLOR[f.id] === '#240046' ? '#e0aaff' : FIN_COLOR[f.id]); gr.addColorStop(1, '#ffd166');
    ctx.lineWidth = size * 0.14; ctx.strokeStyle = 'rgba(0,0,0,0.85)'; ctx.strokeText(label, W / 2 + size * 0.3, ty);
    ctx.fillStyle = gr; ctx.fillText(label, W / 2 + size * 0.3, ty);
    drawSprite(f.icon, size * 0.9, W / 2 - ctx.measureText(label).width / 2 - size * 0.25, ty, 0, appear * fade);
    ctx.restore();
  }
}

function render(now) {
  if (!G) { drawMenuBackground(now); return; }
  drawStageBG(now);
  if (G.bfx) drawBossFx(G.bfx, now);
  const f = G.fin;
  if (f) drawFinisherUnder(f, now);
  ctx.save();
  if (G.shake > 0) ctx.translate((Math.random() - 0.5) * S * 0.03 * G.shake, (Math.random() - 0.5) * S * 0.03 * G.shake);

  for (const s of G.splats) {
    ctx.globalAlpha = 0.38 * Math.min(1, s.life / s.max * 1.5); ctx.fillStyle = s.color; ctx.strokeStyle = s.color; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r * 0.6, 0, 7); ctx.fill();
    for (const bl of s.blobs) { ctx.beginPath(); ctx.arc(s.x + bl.dx, s.y + bl.dy, bl.r, 0, 7); ctx.fill(); }
    for (const d of s.drips) {
      ctx.lineWidth = d.w; ctx.beginPath(); ctx.moveTo(s.x + d.dx, s.y); ctx.lineTo(s.x + d.dx, s.y + d.len); ctx.stroke();
      ctx.beginPath(); ctx.arc(s.x + d.dx, s.y + d.len, d.w * 0.75, 0, 7); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;

  for (const p of G.pieces) {
    const sp = p.art ? art('s', p.art, p.r) : sprite(p.e, p.size), L = sp.logical;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.d + p.c); ctx.translate(0, -p.cy);
    ctx.beginPath(); if (p.side < 0) ctx.rect(-L, -L, L * 2, L + p.off); else ctx.rect(-L, p.off, L * 2, L); ctx.clip();
    ctx.save(); ctx.rotate(p.r0 - p.c); ctx.drawImage(sp, -L / 2, -L / 2, L, L); ctx.restore();
    const ch = Math.sqrt(Math.max(0, p.r * p.r - p.off * p.off));
    if (p.art && FLESH[p.art]) {
      // 果肉切面：一個會隨翻轉變扁/變圓的橢圓，看起來像立體的剖面
      const fl = art('f', p.art, p.r), FL = fl.logical, vis = 0.3 + 0.45 * Math.abs(Math.sin(p.d * 0.8 + p.ph));
      ctx.translate(0, p.off); ctx.scale(ch / p.r, ch / p.r * vis);
      ctx.drawImage(fl, -FL / 2, -FL / 2, FL, FL);
    } else {
      ctx.fillStyle = p.col; ctx.globalAlpha = 0.85;
      ctx.fillRect(-ch * 0.8, p.off - (p.side < 0 ? 3 : 0), ch * 1.6, 3);
    }
    ctx.restore();
  }

  const b = G.boss;
  if (b && !b.hidden) {
    const pulse = 1 + Math.sin(now / 150) * 0.05, phase2 = b.hp < b.maxHp / 2;
    const ag = ctx.createRadialGradient(b.x, b.y, b.r * 0.3, b.x, b.y, b.r * 1.6 * pulse);
    ag.addColorStop(0, (phase2 ? '#ff2e63' : b.def.color) + '88'); ag.addColorStop(1, '#00000000');
    ctx.fillStyle = ag; ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 1.6 * pulse, 0, 7); ctx.fill();
    const wk = b.windup > 0 ? 1 - b.windup / b.windupMax : 0; // 蓄力進度 0→1
    const fk = f ? Math.min(1, f.t / f.brk) : 0;               // 擊殺技蓄力進度
    const jit = f ? (Math.random() - 0.5) * b.r * 0.12 * fk : b.windup > 0 ? (Math.random() - 0.5) * b.r * 0.08 * (0.3 + wk) : 0;
    const bx = b.x + jit, by = b.y + jit, tilt = Math.sin(b.t * 2) * 0.12;
    ctx.save();
    if (f) ctx.filter = { ice: `saturate(${1 - fk * 0.8}) hue-rotate(${fk * 170}deg) brightness(${1 + fk * 0.6})`, shadow: `brightness(${1 - fk})`,
      fire: `sepia(${fk}) saturate(${1 + fk * 3}) brightness(${1 + fk * 0.3})` }[f.id] || `brightness(${1 + fk * 0.6})`;
    else if (b.flash > 0) ctx.filter = 'brightness(1.8)';
    else if (b.windup > 0) ctx.filter = `sepia(${wk * 0.6}) saturate(${1 + wk * 2}) hue-rotate(-${wk * 25}deg) brightness(${1 + wk * 0.3})`;
    else if (b.slow > 0) ctx.filter = 'hue-rotate(160deg) saturate(0.6) brightness(1.3)';
    drawArt('s', b.def.skin, b.r * (b.flash > 0 ? 1.08 : 1 + wk * 0.08), bx, by, tilt);
    ctx.restore();
    if (!f) drawBossFace(bx, by, b.r, tilt, phase2 || b.windup > 0, now);
    else if (f.id === 'shadow') { ctx.fillStyle = '#e0aaff'; circle(bx - b.r * 0.3, by - b.r * 0.05, b.r * 0.08); circle(bx + b.r * 0.3, by - b.r * 0.05, b.r * 0.08); }
    drawSprite('👑', b.r * 0.8, bx, by - b.r * 1.0 + Math.sin(now / 200) * 4, tilt);

    // 丟炸彈預告：Boss 頭上的「！」+ 炸彈飛行路線（虛線）
    if (b.windup > 0 && b.plan) {
      const blink = 0.5 + 0.5 * Math.sin(now / 60);
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = `900 ${S * (0.1 + wk * 0.04)}px ${FONT}`;
      ctx.lineWidth = S * 0.012; ctx.strokeStyle = '#000'; ctx.strokeText('！', bx, by - b.r * 1.75);
      ctx.fillStyle = blink > 0.5 ? '#ff3b3b' : '#ffd166'; ctx.fillText('！', bx, by - b.r * 1.75);
      for (const p of b.plan) {
        if (p.kind !== 'bomb') continue;
        const pts = bombPath(b, p), shown = Math.ceil(pts.length * Math.min(1, wk * 1.6 + 0.2));
        ctx.fillStyle = '#ff3b3b';
        for (let i = 0; i < shown; i++) {
          ctx.globalAlpha = (0.35 + 0.5 * blink) * (1 - i / pts.length * 0.5);
          ctx.beginPath(); ctx.arc(pts[i][0], pts[i][1], S * 0.007, 0, 7); ctx.fill();
        }
        ctx.globalAlpha = 1;
        const end = pts[Math.max(0, shown - 1)];
        if (end) drawSprite('⚠️', S * 0.06, end[0], Math.min(H - S * 0.05, end[1]), 0, 0.6 + 0.4 * blink);
      }
      drawArt('s', 'bomb', S * 0.035 * (0.4 + wk * 0.6), b.x, b.y + b.r * 0.55);
    }
  }

  for (const o of G.objs) {
    if (o.kind === 'star' || o.kind === 'heart') {
      ctx.globalAlpha = 0.5; ctx.fillStyle = o.kind === 'star' ? '#ffd166' : '#ff5c8a';
      ctx.beginPath(); ctx.arc(o.x, o.y, o.r * (1.2 + Math.sin(now / 120) * 0.1), 0, 7); ctx.fill(); ctx.globalAlpha = 1;
    }
    if (o.kind === 'bomb') { ctx.globalAlpha = 0.35; ctx.fillStyle = '#ff2e2e'; ctx.beginPath(); ctx.arc(o.x, o.y, o.r * 1.15, 0, 7); ctx.fill(); ctx.globalAlpha = 1; }
    if (o.art) drawArt('s', o.art, o.r, o.x, o.y, o.rot);
    else drawSprite(o.e, o.r * 2, o.x, o.y, o.rot);
  }

  // 龍息
  for (const bm of G.beams) {
    const a = 1 - bm.t / bm.dur, band = S * 0.13;
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = a;
    ctx.fillStyle = vgrad(bm.y - band, bm.y + band, [[0, 'rgba(255,80,0,0)'], [0.35, 'rgba(255,140,0,0.7)'], [0.5, 'rgba(255,240,180,0.95)'], [0.65, 'rgba(255,140,0,0.7)'], [1, 'rgba(255,80,0,0)']]);
    ctx.fillRect(0, bm.y - band, Math.max(0, bm.head), band * 2);
    ctx.restore();
    if (bm.t < 0.5) drawSprite('🐲', S * 0.16, bm.head, bm.y, 0);
  }
  for (const h of G.homers) drawSprite('🌸', S * 0.045, h.x, h.y, h.rot);

  for (const rg of G.rings) {
    const k = 1 - rg.life / rg.max;
    ctx.globalAlpha = rg.life / rg.max; ctx.strokeStyle = rg.color; ctx.lineWidth = S * rg.w * (1 - k) + 1;
    ctx.beginPath(); ctx.arc(rg.x, rg.y, rg.r1 * (0.3 + 0.7 * k), 0, 7); ctx.stroke();
  }
  for (const bl of G.bolts) {
    ctx.globalAlpha = bl.life / bl.max;
    for (const [w, c] of [[S * 0.018 * bl.w, '#ffd60a'], [S * 0.006 * bl.w, '#ffffff']]) {
      ctx.strokeStyle = c; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(...bl.pts[0]);
      for (const p of bl.pts) ctx.lineTo(...p); ctx.stroke();
    }
  }
  ctx.lineCap = 'round';
  for (const sl of G.slashes) {
    const a = sl.life / sl.max, prog = sl.grow ? Math.min(1, (sl.max - sl.life) / (sl.max * 0.25)) : 1;
    const ex = sl.x1 + (sl.x2 - sl.x1) * prog, ey = sl.y1 + (sl.y2 - sl.y1) * prog, w = sl.w * (0.4 + 0.6 * a);
    ctx.globalAlpha = a * 0.55; ctx.strokeStyle = sl.color; ctx.lineWidth = w * 2.6;
    ctx.beginPath(); ctx.moveTo(sl.x1, sl.y1); ctx.lineTo(ex, ey); ctx.stroke();
    ctx.globalAlpha = a; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = w * 0.7;
    ctx.beginPath(); ctx.moveTo(sl.x1, sl.y1); ctx.lineTo(ex, ey); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  for (const p of G.parts) {
    const a = Math.max(0, p.life / p.max);
    if (p.e) { drawSprite(p.e, p.size, p.x, p.y, p.rot, a); continue; }
    ctx.globalAlpha = a; ctx.fillStyle = p.color; ctx.strokeStyle = p.color;
    if (p.drop) {
      // 果汁水滴：順著飛行方向拉長
      ctx.globalAlpha = a * 0.9;
      const sp = Math.hypot(p.vx, p.vy), st = 1 + Math.min(2, sp / (S * 1.2));
      ctx.beginPath(); ctx.ellipse(p.x, p.y, p.size * st, p.size, Math.atan2(p.vy, p.vx), 0, 7); ctx.fill();
    } else if (p.kind === 'petal') drawPetal(p.x, p.y, p.size, p.rot, p.color, a);
    else if (p.kind === 'shard') {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.beginPath(); ctx.moveTo(0, -p.size); ctx.lineTo(p.size * 0.5, p.size * 0.6); ctx.lineTo(-p.size * 0.4, p.size * 0.4); ctx.closePath(); ctx.fill();
      ctx.globalAlpha = a * 0.8; ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.stroke(); ctx.restore();
    } else if (p.kind === 'streak') {
      const ang = p.orbit ? p.orbit.ang + Math.PI / 2 : Math.atan2(p.vy, p.vx), len = S * 0.05;
      ctx.lineWidth = p.size; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - Math.cos(ang) * len, p.y - Math.sin(ang) * len); ctx.stroke();
    } else if (p.kind === 'flame') {
      ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = a * 0.8;
      ctx.fillStyle = radial(ctx, p.x, p.y, 0, p.size, [[0, p.color], [1, 'rgba(255,60,0,0)']]); circle(p.x, p.y, p.size); ctx.restore();
    } else if (p.kind === 'ghost') {
      ctx.globalAlpha = a * 0.6; ctx.fillStyle = radial(ctx, p.x, p.y, 0, p.size, [[0, p.color], [1, 'rgba(20,0,40,0)']]); circle(p.x, p.y, p.size);
    } else circle(p.x, p.y, p.size);
  }
  ctx.globalAlpha = 1;

  drawTrail(now);

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const t of G.texts) {
    const a = Math.min(1, t.life / t.max * 2), sc = 1 + Math.max(0, (t.life - t.max + 0.15)) * 3;
    ctx.globalAlpha = a; ctx.font = `900 ${t.size * sc}px ${FONT},${EMOJI_FONT}`;
    ctx.lineWidth = t.size * 0.18; ctx.strokeStyle = 'rgba(0,0,0,.7)'; ctx.strokeText(t.str, t.x, t.y);
    ctx.fillStyle = t.color; ctx.fillText(t.str, t.x, t.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  if (f) drawFinisherOver(f, now);
  if (G.warnT > 0 && G.boss) {
    const a = Math.min(1, G.warnT) * (0.6 + 0.4 * Math.sin(now / 80));
    ctx.globalAlpha = a * 0.55; ctx.fillStyle = '#c1121f'; ctx.fillRect(0, H * 0.5 - S * 0.09, W, S * 0.18);
    ctx.globalAlpha = a; ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `900 ${S * 0.075}px ${FONT}`;
    ctx.fillText('⚠ BOSS 來襲 ⚠', W / 2, H * 0.5 - S * 0.025);
    ctx.font = `700 ${S * 0.045}px ${FONT}`;
    ctx.fillText(`${G.boss.name}（${G.bossIndex + 1}/5）`, W / 2, H * 0.5 + S * 0.05);
    ctx.globalAlpha = 1;
  }
  if (!f && G.timeScale < 0.95) { ctx.globalAlpha = (1 - G.timeScale) * 0.35; ctx.fillStyle = '#7fd3ff'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  if (G.flash > 0) { ctx.globalAlpha = Math.min(0.85, G.flash * 2); ctx.fillStyle = G.flashColor; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
}

// Boss 的生氣臉：眼白、跟著動的黑眼珠、八字眉；蓄力或狂暴時嘴巴張開
function drawBossFace(x, y, r, tilt, angry, now) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(tilt);
  const look = Math.sin(now / 700) * r * 0.04;
  for (const s of [-1, 1]) {
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(s * r * 0.3, -r * 0.05, r * 0.15, r * 0.12, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(s * r * 0.3 + look, -r * 0.02, r * 0.065, 0, 7); ctx.fill();
    ctx.strokeStyle = '#1a0a00'; ctx.lineWidth = r * 0.08; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(s * r * 0.48, -r * (angry ? 0.3 : 0.24)); ctx.lineTo(s * r * 0.14, -r * (angry ? 0.14 : 0.2)); ctx.stroke();
  }
  ctx.fillStyle = '#3a0505';
  if (angry) { ctx.beginPath(); ctx.ellipse(0, r * 0.32, r * 0.22, r * 0.13, 0, 0, 7); ctx.fill(); ctx.fillStyle = '#fff'; ctx.fillRect(-r * 0.14, r * 0.2, r * 0.28, r * 0.05); }
  else { ctx.strokeStyle = '#3a0505'; ctx.lineWidth = r * 0.06; ctx.beginPath(); ctx.arc(0, r * 0.45, r * 0.2, -2.5, -0.64); ctx.stroke(); }
  ctx.restore();
}

function drawTrail(now) {
  const tr = G.trail;
  while (tr.length && now - tr[0].t > 130) tr.shift();
  if (tr.length < 2) return;
  const b = blade(), base = S * (0.011 + 0.003 * bladeLvl());
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (let pass = 0; pass < 2; pass++) {
    for (let i = 1; i < tr.length; i++) {
      const k = i / (tr.length - 1), a = tr[i - 1], c = tr[i];
      const col = b.rainbow ? `hsl(${(now / 3 + i * 30) % 360},100%,65%)` : b.colors[Math.min(b.colors.length - 1, Math.floor((1 - k) * b.colors.length))];
      ctx.strokeStyle = pass === 0 ? col : '#fff';
      ctx.globalAlpha = pass === 0 ? 0.25 + 0.55 * k : 0.9 * k;
      ctx.lineWidth = pass === 0 ? base * (b.id === 'wind' ? 3.4 : 2.4) * k + 1 : base * 0.6 * k + 0.5;
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(c.x, c.y); ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
}

const TRAIL_COLORS = { fire: ['#ffd166', '#ff6a00', '#ff2e00'], ice: ['#ffffff', '#a8e6ff'], thunder: ['#fff3a0', '#ffd60a'],
  wind: ['#ffffff', '#c7f9cc', '#57cc99'], shadow: ['#c77dff', '#7b2cbf', '#240046'], galaxy: ['#ffffff', '#a0c4ff', '#cdb4db', '#ffd166'],
  dragon: ['#fff3b0', '#ffd60a', '#ff6a00'] };
function trailParticle(x, y) {
  const id = blade().id;
  if (id === 'basic' || Math.random() > 0.5) return;
  if (id === 'love') { if (Math.random() < 0.3) addPart({ x, y, vx: (Math.random() - 0.5) * S * 0.2, vy: -S * 0.1, life: 0.6, max: 0.6, e: '💗', size: S * 0.03, g: -0.05, rot: 0 }); return; }
  if (id === 'sakura') { addPart({ x, y, vx: (Math.random() - 0.5) * S * 0.3, vy: S * 0.05, life: 0.7, max: 0.7, kind: 'petal', color: Math.random() < 0.5 ? '#ffc8dd' : '#ff8fab', size: S * 0.01, g: 0.15, rot: Math.random() * 6 }); return; }
  if (id === 'galaxy' && Math.random() < 0.15) { addPart({ x, y, vx: 0, vy: 0, life: 0.5, max: 0.5, e: '✨', size: S * 0.025, g: 0, rot: 0 }); return; }
  const col = TRAIL_COLORS[id]; if (!col) return;
  addPart({ x, y, vx: (Math.random() - 0.5) * S * 0.3, vy: (id === 'fire' || id === 'dragon' ? -1 : 0.2) * S * 0.3 * Math.random(), life: 0.35, max: 0.35, color: col[Math.random() * col.length | 0], size: S * (0.004 + Math.random() * 0.006), g: id === 'ice' ? 0.3 : 0, kind: id === 'shadow' ? 'ghost' : undefined });
}

// ===== 輸入 =====
let activePointer = null, lastPt = null;
cv.addEventListener('pointerdown', e => {
  audio();
  if (state !== 'play' || activePointer !== null) return;
  activePointer = e.pointerId;
  lastPt = { x: e.clientX, y: e.clientY, t: e.timeStamp };
  G.trail = [{ x: lastPt.x, y: lastPt.y, t: performance.now() }];
  G.strokeCount = 0;
});
cv.addEventListener('pointermove', e => {
  if (state !== 'play' || e.pointerId !== activePointer) return;
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  for (const ev of (evs.length ? evs : [e])) {
    const p = { x: ev.clientX, y: ev.clientY, t: ev.timeStamp };
    handleSegment(lastPt.x, lastPt.y, p.x, p.y, Math.max(1, p.t - lastPt.t));
    lastPt = p;
    G.trail.push({ x: p.x, y: p.y, t: performance.now() });
    trailParticle(p.x, p.y);
  }
});
function endStroke(e) {
  if (e.pointerId !== activePointer) return;
  activePointer = null;
  if (state === 'play' && G.strokeCount >= 3) {
    const n = G.strokeCount;
    G.score += n; addCoins(Math.floor(n / 2) * coinMult());
    text(lastPt.x, lastPt.y - S * 0.05, `${n} 連斬！+${n}`, '#ffd166', 0.075, 1.1);
    sfx.coin(); updateHUD();
  }
  if (G) G.strokeCount = 0;
}
cv.addEventListener('pointerup', endStroke);
cv.addEventListener('pointercancel', endStroke);

// ===== 介面 =====
const $ = id => document.getElementById(id);
const screens = ['menu', 'stages', 'shop', 'pause', 'over', 'clear', 'cloud', 'nameset'];
let shopReturn = 'menu', curStage = 0;
function show(id) { for (const s of screens) $(s).classList.toggle('hidden', s !== id); $('hud').classList.toggle('hidden', !(state === 'play' || state === 'paused')); }

function updateHUD() {
  if (!G) return;
  $('score').textContent = G.score;
  $('best-hud').textContent = '最高 ' + Math.max(save.stageBest[G.stage] || 0, G.score);
  $('stage-hud').textContent = `${G.st.icon} ${G.st.name}・Boss ${G.bossIndex}/5`;
  const slots = Math.max(START_HEARTS + perkLvl('life'), G.hearts);
  $('hearts').textContent = '❤️'.repeat(Math.max(0, G.hearts)) + '🤍'.repeat(Math.max(0, slots - G.hearts));
  $('coins-hud').textContent = '💰 ' + save.coins;
  const b = blade();
  $('blade-hud').textContent = `${b.icon} ${b.name} Lv.${bladeLvl()}`;
}
function goMenu() {
  if (!save.cloud || !save.cloud.name) return openNameSet();
  dailyReward();
  state = 'menu'; G = null;
  $('menu-title').textContent = CONFIG.title;
  $('menu-sub').textContent = `專屬 ${CONFIG.herName} 的切水果遊戲 💕`;
  $('menu-best').textContent = save.best; $('menu-coins').textContent = save.coins;
  $('boss-bar').classList.add('hidden');
  show('menu');
}
// 每日登入獎勵：每天第一次回到主選單時發放；連續天數越多越多（最多 7 天）
function dailyReward() {
  const d = new Date(), today = `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
  const y = new Date(d - 864e5), yesterday = `${y.getFullYear()}-${y.getMonth() + 1}-${y.getDate()}`;
  const daily = save.daily || {};
  if (daily.last === today) return;
  const streak = daily.last === yesterday ? Math.min(7, (daily.streak || 0) + 1) : 1;
  const gift = 100 + 50 * (streak - 1);
  save.daily = { last: today, streak }; save.coins += gift; persist();
  const el = $('daily'); el.textContent = `🎁 每日登入第 ${streak} 天：+${gift} 💰` + (streak < 7 ? `（明天 +${gift + 50}）` : '');
  el.classList.remove('hidden'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.add('hidden'), 4500);
}
function openStages() { state = 'stages'; renderStages(); show('stages'); }
function renderStages() {
  const list = $('stage-list'); list.innerHTML = '';
  STAGES.forEach((st, i) => {
    const locked = i >= save.unlocked;
    const bt = document.createElement('button');
    bt.className = 'stage'; bt.disabled = locked; bt.style.background = st.card;
    const info = locked ? '🔒 打倒上一關的 5 隻 Boss 後解鎖' : `${save.cleared[i] ? '✅ 已通關・' : ''}最高分 ${save.stageBest[i] || 0}`;
    bt.innerHTML = `<div class="s-icon">${locked ? '🔒' : st.icon}</div><div class="s-name">第 ${i + 1} 關　${st.name}</div><div class="s-go">${locked ? '' : '▶'}</div><div class="s-info">${info}</div>`;
    bt.onclick = () => startGame(i);
    list.appendChild(bt);
  });
}
function startGame(stage) { audio(); curStage = stage; newGame(stage); state = 'play'; show(null); updateHUD(); }
function pauseGame() { if (state !== 'play') return; state = 'paused'; persist(); show('pause'); }
function recordScore() {
  save.stageBest[G.stage] = Math.max(save.stageBest[G.stage] || 0, G.score);
  const rec = G.score > save.best;
  if (rec) save.best = G.score;
  return rec;
}
function gameOver() {
  state = 'over';
  const rec = recordScore();
  persist();
  $('over-score').textContent = G.score; $('over-best').textContent = save.best; $('over-coins').textContent = G.coinsEarned;
  $('over-record').classList.toggle('hidden', !rec);
  $('boss-bar').classList.add('hidden');
  show('over');
}
function stageClear() {
  state = 'clear';
  const i = G.stage;
  const firstBonus = save.cleared[i] ? 0 : addCoins(300 * (i + 1)); // 第一次通關獎勵
  save.cleared[i] = true;
  const unlockNew = i + 1 < STAGES.length && save.unlocked < i + 2;
  if (unlockNew) save.unlocked = i + 2;
  recordScore();
  persist();
  $('clear-stage').textContent = `${G.st.icon} ${G.st.name} 完成！` + (firstBonus ? `　首次通關獎勵 +${firstBonus} 💰` : '');
  $('clear-score').textContent = G.score; $('clear-coins').textContent = G.coinsEarned;
  $('clear-unlock').classList.toggle('hidden', !unlockNew);
  if (unlockNew) $('clear-unlock').textContent = `🔓 解鎖新關卡：${STAGES[i + 1].icon} ${STAGES[i + 1].name}`;
  $('btn-next').classList.toggle('hidden', i + 1 >= STAGES.length);
  $('boss-bar').classList.add('hidden');
  sfx.win();
  show('clear');
}
function openShop(from) { shopReturn = from; state = 'shop'; renderShop(); show('shop'); }

let shopTab = 'blades';
function renderShop() {
  $('shop-coins').textContent = save.coins;
  for (const t of document.querySelectorAll('.tab')) t.classList.toggle('active', t.dataset.tab === shopTab);
  const list = $('shop-list'); list.innerHTML = '';
  if (shopTab === 'perks') return renderPerks(list);
  for (const b of BLADES) {
    const owned = !!save.owned[b.id], lvl = save.levels[b.id] || 1, eq = save.equipped === b.id;
    const card = document.createElement('div');
    card.className = 'card' + (eq ? ' equipped' : '');
    const sw = b.rainbow ? 'linear-gradient(90deg,#ff5c8a,#ffd166,#8ac926,#3fa7d6,#9d4edd)' : `linear-gradient(90deg,${b.colors.join(',')})`;
    card.innerHTML = `<div class="icon">${b.icon}</div>
      <div class="name">${b.name}<span class="lv">${owned ? '★'.repeat(lvl) + '☆'.repeat(MAX_LEVEL - lvl) : ''}</span></div>
      <div class="desc">${b.desc}<br>💥 擊殺技：<b>${b.finisher}</b></div>
      <div class="fx">${owned ? effectText(b, lvl) + (lvl < MAX_LEVEL ? `<br>升級後：${effectText(b, lvl + 1)}` : '') : effectText(b, 1)}</div>
      <div class="swatch" style="background:${sw}"></div>
      <div class="actions"></div>`;
    const act = card.querySelector('.actions');
    const mk = (label, cls, disabled, fn) => { const bt = document.createElement('button'); bt.className = 'btn ' + cls; bt.textContent = label; bt.disabled = disabled; bt.onclick = () => { audio(); fn(); }; act.appendChild(bt); };
    if (!owned && !bladeUnlocked(b)) {
      mk(`🔒 ${reqText(b)}`, 'ghost', true, () => {});
    } else if (!owned) {
      mk(`購買 💰${b.price}`, '', save.coins < b.price, () => { save.coins -= b.price; save.owned[b.id] = true; save.levels[b.id] = 1; save.equipped = b.id; persist(); sfx.win(); renderShop(); });
    } else {
      mk(eq ? '使用中' : '裝備', eq ? 'ghost' : 'alt', eq, () => { save.equipped = b.id; persist(); sfx.coin(); renderShop(); });
      if (lvl < MAX_LEVEL) { const c = upgradeCost(b, lvl); mk(`升級 💰${c}`, '', save.coins < c, () => { save.coins -= c; save.levels[b.id] = lvl + 1; persist(); sfx.win(); renderShop(); }); }
      else mk('已滿級 ✨', 'ghost', true, () => {});
    }
    list.appendChild(card);
  }
}

function renderPerks(list) {
  save.perks = save.perks || {};
  for (const p of PERKS) {
    const lvl = perkLvl(p.id), maxed = lvl >= p.max;
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `<div class="icon">${p.icon}</div>
      <div class="name">${p.name}<span class="lv">${'★'.repeat(lvl)}${'☆'.repeat(p.max - lvl)}</span></div>
      <div class="desc">目前：${lvl ? p.desc(lvl) : '尚未強化'}</div>
      <div class="fx">${maxed ? '已經強化到最高等級 ✨' : `升級後：${p.desc(lvl + 1)}`}</div>
      <div class="actions"></div>`;
    const bt = document.createElement('button');
    const cost = perkCost(p, lvl);
    bt.className = 'btn' + (maxed ? ' ghost' : '');
    bt.textContent = maxed ? '已滿級 ✨' : `強化 💰${cost}`;
    bt.disabled = maxed || save.coins < cost;
    bt.onclick = () => { audio(); save.coins -= cost; save.perks[p.id] = lvl + 1; persist(); sfx.win(); renderShop(); };
    card.querySelector('.actions').appendChild(bt);
    list.appendChild(card);
  }
}
for (const t of document.querySelectorAll('.tab')) t.onclick = () => { audio(); shopTab = t.dataset.tab; renderShop(); };
$('version').textContent = 'v' + VERSION;

$('btn-play').onclick = openStages;
$('btn-stages-back').onclick = goMenu;
$('btn-shop').onclick = () => openShop('menu');
$('btn-shop-back').onclick = () => {
  if (shopReturn === 'over') { state = 'over'; show('over'); }
  else if (shopReturn === 'clear') { state = 'clear'; show('clear'); }
  else goMenu();
};
$('pause-btn').onclick = pauseGame;
$('btn-resume').onclick = () => { state = 'play'; show(null); };
$('btn-quit').onclick = () => { if (G) recordScore(); persist(); goMenu(); };
$('btn-again').onclick = () => startGame(curStage);
$('btn-over-shop').onclick = () => openShop('over');
$('btn-over-menu').onclick = goMenu;
$('btn-next').onclick = () => startGame(Math.min(STAGES.length - 1, curStage + 1));
$('btn-clear-shop').onclick = () => openShop('clear');
$('btn-clear-menu').onclick = goMenu;
document.addEventListener('visibilitychange', () => { if (document.hidden) { persist(); pauseGame(); cloudSync(); } });

// ===== 暱稱與雲端存檔畫面 =====
let cloudReturn = 'menu', restoreArmed = false;
function openNameSet() { state = 'nameset'; G = null; $('boss-bar').classList.add('hidden'); show('nameset'); }
function openCloud(from) {
  cloudReturn = from; state = 'cloud'; restoreArmed = false;
  $('restore-box').classList.toggle('hidden', from !== 'nameset');
  $('restore-msg').textContent = ''; $('btn-restore').textContent = '恢復進度';
  renderCloud(); show('cloud');
}
function renderCloud() {
  const c = save.cloud;
  $('cloud-name').textContent = c ? c.name : '（還沒取暱稱）';
  $('cloud-code').textContent = c ? c.code : '—';
  $('btn-copy-code').classList.toggle('hidden', !c);
  const t = CLOUD.lastSync ? new Date(CLOUD.lastSync).toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' }) : '';
  $('cloud-status').textContent = {
    off: '⚠️ 雲端還沒設定好，目前進度只存在這支手機',
    offline: '⚠️ 目前離線，連上網路後會自動同步',
    syncing: '同步中…',
    ok: `✅ 已同步到雲端（${t}）`,
  }[CLOUD.state] || '';
}
$('btn-name-ok').onclick = () => {
  audio();
  const name = $('name-input').value.trim().slice(0, 12) || '玩家';
  save.cloud = { code: newCode(), name };
  persist(); cloudSync();
  openCloud('menu'); // 先讓玩家看到恢復碼，提醒截圖
};
$('btn-name-restore').onclick = () => { audio(); openCloud('nameset'); };
$('btn-cloud').onclick = () => { audio(); openCloud('menu'); };
$('btn-cloud-back').onclick = () => { if (cloudReturn === 'nameset' && !(save.cloud && save.cloud.name)) openNameSet(); else goMenu(); };
$('btn-copy-code').onclick = async () => {
  const code = save.cloud && save.cloud.code; if (!code) return;
  try { await navigator.clipboard.writeText(code); $('btn-copy-code').textContent = '✅ 已複製'; }
  catch (e) { $('btn-copy-code').textContent = '請長按恢復碼複製'; }
  setTimeout(() => { $('btn-copy-code').textContent = '📋 複製恢復碼'; }, 1800);
};
$('btn-restore-open').onclick = () => { $('restore-box').classList.toggle('hidden'); };
$('btn-restore').onclick = async () => {
  const input = $('restore-input').value;
  // 已經有進度的話，要按第二次才會覆蓋
  if (save.cloud && save.cloud.name && !restoreArmed) {
    restoreArmed = true; $('btn-restore').textContent = '確定覆蓋目前進度？再按一次';
    $('restore-msg').textContent = '恢復後，這支手機目前的進度會被雲端的進度取代。';
    return;
  }
  $('restore-msg').textContent = '讀取中…';
  try {
    const name = await cloudRestore(input);
    $('restore-msg').textContent = `✅ 歡迎回來，${name}！`;
    sfx.win(); CLOUD.lastSync = Date.now(); CLOUD.state = 'ok';
    setTimeout(goMenu, 900);
  } catch (e) { $('restore-msg').textContent = '❌ ' + e.message; restoreArmed = false; $('btn-restore').textContent = '恢復進度'; }
};

// ===== 主迴圈 =====
let last = performance.now();
function loop(now) {
  const rdt = Math.min(0.033, (now - last) / 1000); last = now;
  if (state === 'play') update(rdt);
  render(now);
  requestAnimationFrame(loop);
}
goMenu();
requestAnimationFrame(loop);
cloudInit();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
