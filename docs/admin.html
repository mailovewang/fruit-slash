<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>玩家後台</title>
<style>
  :root { --bg: #14081a; --panel: #241030; --line: #3d2148; --text: #fff5f8; --muted: #cfa9c4; --gold: #ffd166; --pink: #ff5c8a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
  h1 { margin: 0; font-size: 20px; flex: 1; min-width: 200px; }
  #who { color: var(--muted); font-size: 13px; }
  button { font: inherit; font-weight: 700; border: 0; border-radius: 999px; padding: 8px 18px; cursor: pointer; color: #fff; background: var(--pink); }
  button.ghost { background: rgba(255,255,255,.1); }
  main { padding: 16px 20px; max-width: 1100px; margin: 0 auto; }
  #msg { color: var(--muted); white-space: pre-line; }
  #msg code { color: var(--gold); user-select: all; }
  .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
  input { font: inherit; padding: 9px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--text); width: min(360px, 100%); }
  #count { color: var(--muted); font-size: 13px; }
  .wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
  table { width: 100%; border-collapse: collapse; min-width: 640px; }
  th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { background: var(--panel); color: var(--muted); font-weight: 700; font-size: 13px; position: sticky; top: 0; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.code { font-family: ui-monospace, Consolas, monospace; color: var(--gold); user-select: all; }
  tr:last-child td { border-bottom: 0; }
  .copy { padding: 3px 10px; font-size: 12px; margin-left: 8px; }
</style>
</head>
<body>
<header>
  <h1>🍉 寶貝切切樂・玩家後台</h1>
  <span id="who"></span>
  <button id="login" hidden>用 Google 登入</button>
  <button id="logout" class="ghost" hidden>登出</button>
</header>
<main>
  <p id="msg">載入中…</p>
  <div id="list" hidden>
    <div class="bar">
      <input id="q" placeholder="搜尋暱稱或恢復碼">
      <button id="reload" class="ghost">重新整理</button>
      <span id="count"></span>
    </div>
    <div class="wrap">
      <table>
        <thead><tr><th>暱稱</th><th>恢復碼</th><th>金幣</th><th>最高分</th><th>通關</th><th>版本</th><th>最後同步</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>
</main>
<script src="firebase-config.js"></script>
<script type="module">
const V = '10.12.2';
const $ = id => document.getElementById(id);
const cfg = window.FIREBASE_CONFIG;
let rows = [];

if (!cfg || !cfg.apiKey) {
  $('msg').textContent = 'Firebase 還沒設定（firebase-config.js 是空的）。';
} else {
  const { initializeApp } = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
  const { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`);
  const { getFirestore, collection, getDocs, query, orderBy } = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
  const app = initializeApp(cfg), auth = getAuth(app), db = getFirestore(app);

  $('login').onclick = () => signInWithPopup(auth, new GoogleAuthProvider()).catch(e => { $('msg').textContent = '登入失敗：' + e.message; });
  $('logout').onclick = () => signOut(auth);
  $('reload').onclick = () => load();
  $('q').oninput = render;

  async function load() {
    $('msg').textContent = '讀取玩家資料中…';
    try {
      const snap = await getDocs(query(collection(db, 'saves'), orderBy('updatedAt', 'desc')));
      rows = snap.docs.map(d => ({ code: d.id, ...d.data() }));
      $('msg').textContent = ''; $('list').hidden = false; render();
    } catch (e) {
      $('list').hidden = true;
      const uid = auth.currentUser && auth.currentUser.uid;
      $('msg').innerHTML = e.code === 'permission-denied'
        ? `這個帳號沒有管理權限。\n如果這是你的管理員帳號，請把這串 UID 設定到 firestore.rules：<code>${uid}</code>`
        : '讀取失敗：' + e.message;
    }
  }

  function render() {
    const q = $('q').value.trim().toLowerCase();
    const list = rows.filter(r => !q || (r.name || '').toLowerCase().includes(q) || r.code.toLowerCase().includes(q));
    $('count').textContent = `共 ${rows.length} 位玩家${q ? `，符合 ${list.length} 位` : ''}`;
    const tb = $('rows'); tb.innerHTML = '';
    for (const r of list) {
      const s = r.stats || {}, t = r.updatedAt ? r.updatedAt.toDate().toLocaleString('zh-TW', { hour12: false }) : '—';
      const tr = document.createElement('tr');
      const cells = [r.name || '（無暱稱）', r.code, s.coins ?? '—', s.best ?? '—', `${s.cleared ?? 0} / 5`, r.version || '—', t];
      cells.forEach((v, i) => { const td = document.createElement('td'); td.textContent = v; if (i === 1) td.className = 'code'; if (i >= 2 && i <= 3) td.className = 'num'; tr.appendChild(td); });
      const btn = document.createElement('button'); btn.className = 'copy ghost'; btn.textContent = '複製';
      btn.onclick = () => navigator.clipboard.writeText(r.code).then(() => { btn.textContent = '已複製'; setTimeout(() => btn.textContent = '複製', 1500); });
      tr.children[1].appendChild(btn);
      tb.appendChild(tr);
    }
  }

  onAuthStateChanged(auth, user => {
    $('login').hidden = !!user; $('logout').hidden = !user;
    $('who').textContent = user ? `已登入：${user.displayName || ''}` : '';
    if (user) load(); else { $('list').hidden = true; $('msg').textContent = '請用管理員的 Google 帳號登入。'; }
  });
}
</script>
</body>
</html>
