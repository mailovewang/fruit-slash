<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>玩家後台</title>
<style>
  :root { --bg: #14081a; --panel: #241030; --line: #3d2148; --text: #fff5f8; --muted: #cfa9c4; --gold: #ffd166; --pink: #ff5c8a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
  h1 { margin: 0; font-size: 20px; flex: 1; min-width: 200px; }
  #who { color: var(--muted); font-size: 13px; }
  button { font: inherit; font-weight: 700; border: 0; border-radius: 999px; padding: 8px 18px; cursor: pointer; color: #fff; background: var(--pink); }
  button.ghost { background: rgba(255,255,255,.1); }
  main { padding: 16px 20px; max-width: 1100px; margin: 0 auto; }
  #msg { color: var(--muted); white-space: pre-line; }
  #msg code { color: var(--gold); user-select: all; }
  .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
  input { font: inherit; padding: 9px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--text); width: min(360px, 100%); }
  #count { color: var(--muted); font-size: 13px; }
  .wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
  table { width: 100%; border-collapse: collapse; min-width: 640px; }
  th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { background: var(--panel); color: var(--muted); font-weight: 700; font-size: 13px; position: sticky; top: 0; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.code { font-family: ui-monospace, Consolas, monospace; color: var(--gold); user-select: all; }
  tr:last-child td { border-bottom: 0; }
  .copy { padding: 3px 10px; font-size: 12px; margin-left: 8px; }
</style>
</head>
<body>
<header>
  <h1>🍉 寶貝切切樂・玩家後台</h1>
  <span id="who"></span>
  <button id="login" hidden>用 Google 登入</button>
  <button id="logout" class="ghost" hidden>登出</button>
</header>
<main>
  <p id="msg">載入中…</p>
  <div id="list" hidden>
    <div class="bar">
      <input id="q" placeholder="搜尋暱稱或恢復碼">
      <button id="reload" class="ghost">重新整理</button>
      <button id="backup">⬇ 下載全部存檔備份</button>
      <span id="count"></span>
    </div>
    <div class="wrap">
      <table>
        <thead><tr><th>暱稱</th><th>恢復碼</th><th>金幣</th><th>最高分</th><th>通關</th><th>局數</th><th>切水果</th><th>Boss</th><th>簽到</th><th>寵物</th><th>版本</th><th>最後同步</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <h2 style="font-size:17px;margin:24px 0 8px">🎉 活動開關</h2>
    <p id="evmsg" style="color:var(--muted);font-size:13px;margin:0 0 8px"></p>
    <div class="bar">
      <select id="ev-id" style="font:inherit;padding:8px;border-radius:10px;background:var(--panel);color:var(--text);border:1px solid var(--line)"><option value="halloween">🎃 萬聖節</option></select>
      從 <input type="date" id="ev-from" style="width:auto"> 到 <input type="date" id="ev-to" style="width:auto">
      <button id="ev-on">強制開啟這段時間</button>
      <button id="ev-off" class="ghost">強制關閉</button>
      <button id="ev-auto" class="ghost">恢復依日期自動</button>
    </div>
    <h2 style="font-size:17px;margin:24px 0 8px">🏆 排行榜玩家（公開資料）</h2>
    <p id="pmsg" style="color:var(--muted);font-size:13px;margin:0 0 8px">「移除」：從排行榜拿掉（玩家下次開遊戲會重新出現）。「封鎖」：拿掉而且不能再上榜、送禮、發挑戰。</p>
    <div class="wrap">
      <table>
        <thead><tr><th>暱稱</th><th>好友碼</th><th>最高分</th><th>無盡</th><th>通關</th><th>最後更新</th><th></th></tr></thead>
        <tbody id="prows"></tbody>
      </table>
    </div>
  </div>
</main>
<script src="firebase-config.js"></script>
<script type="module">
const V = '10.12.2';
const $ = id => document.getElementById(id);
const cfg = window.FIREBASE_CONFIG;
let rows = [];

if (!cfg || !cfg.apiKey) {
  $('msg').textContent = 'Firebase 還沒設定（firebase-config.js 是空的）。';
} else {
  const { initializeApp } = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
  const { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`);
  const { getFirestore, collection, getDocs, getDoc, query, orderBy, doc, deleteDoc, setDoc, serverTimestamp } = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
  const app = initializeApp(cfg);
  if (window.RECAPTCHA_SITE_KEY) {
    const { initializeAppCheck, ReCaptchaEnterpriseProvider } = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app-check.js`);
    initializeAppCheck(app, { provider: new ReCaptchaEnterpriseProvider(window.RECAPTCHA_SITE_KEY), isTokenAutoRefreshEnabled: true });
  }
  const auth = getAuth(app), db = getFirestore(app);

  $('login').onclick = () => signInWithPopup(auth, new GoogleAuthProvider()).catch(e => { $('msg').textContent = '登入失敗：' + e.message; });
  $('logout').onclick = () => signOut(auth);
  $('reload').onclick = () => load();
  $('q').oninput = render;
  // 每次發新版前按一下：把所有玩家的雲端存檔存成一個 JSON 檔（請存在電腦裡，不要放進公開的 repo）
  $('backup').onclick = () => {
    const data = rows.map(r => ({ ...r, updatedAt: r.updatedAt ? r.updatedAt.toDate().toISOString() : null }));
    const blob = new Blob([JSON.stringify({ exportedAt: new Date().toISOString(), count: data.length, saves: data }, null, 1)], { type: 'application/json' });
    const a = document.createElement('a'), d = new Date();
    a.href = URL.createObjectURL(blob);
    a.download = `寶貝切切樂-存檔備份-${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}-${String(d.getHours()).padStart(2, '0')}${String(d.getMinutes()).padStart(2, '0')}.json`;
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  };

  async function load() {
    $('msg').textContent = '讀取玩家資料中…';
    try {
      const snap = await getDocs(query(collection(db, 'saves'), orderBy('updatedAt', 'desc')));
      rows = snap.docs.map(d => ({ code: d.id, ...d.data() }));
      $('msg').textContent = ''; $('list').hidden = false; render();
      loadProfiles(); loadEvent();
    } catch (e) {
      $('list').hidden = true;
      const uid = auth.currentUser && auth.currentUser.uid;
      $('msg').innerHTML = e.code === 'permission-denied'
        ? `這個帳號沒有管理權限。\n如果這是你的管理員帳號，請把這串 UID 設定到 firestore.rules：<code>${uid}</code>`
        : '讀取失敗：' + e.message;
    }
  }

  function render() {
    const q = $('q').value.trim().toLowerCase();
    const list = rows.filter(r => !q || (r.name || '').toLowerCase().includes(q) || r.code.toLowerCase().includes(q));
    $('count').textContent = `共 ${rows.length} 位玩家${q ? `，符合 ${list.length} 位` : ''}`;
    const tb = $('rows'); tb.innerHTML = '';
    for (const r of list) {
      const s = r.stats || {}, t = r.updatedAt ? r.updatedAt.toDate().toLocaleString('zh-TW', { hour12: false }) : '—';
      const tr = document.createElement('tr');
      // 遊玩狀況：從玩家存檔裡的統計拿（局數、切了幾顆水果、打倒幾隻 Boss、簽到天數、帶哪隻寵物）
      const sv = r.save || {}, st = sv.stats || {}, pets = { cat: '🐱', dog: '🐶', chick: '🐥', bunny: '🐰', panda: '🐼' };
      const cells = [r.name || '（無暱稱）', r.code, s.coins ?? '—', s.best ?? '—', `${s.cleared ?? 0} / 10`, st.game ?? 0, st.fruit ?? 0, st.boss ?? 0,
        sv.checkin ? sv.checkin.days : 0, sv.pet ? (pets[sv.pet] || sv.pet) : '—', r.version || '—', t];
      cells.forEach((v, i) => { const td = document.createElement('td'); td.textContent = v; if (i === 1) td.className = 'code'; if ((i >= 2 && i <= 3) || (i >= 5 && i <= 8)) td.className = 'num'; tr.appendChild(td); });
      const btn = document.createElement('button'); btn.className = 'copy ghost'; btn.textContent = '複製';
      btn.onclick = () => navigator.clipboard.writeText(r.code).then(() => { btn.textContent = '已複製'; setTimeout(() => btn.textContent = '複製', 1500); });
      tr.children[1].appendChild(btn);
      // 刪除這位玩家的雲端存檔（要按兩次確認，刪了就找不回來）
      const del = document.createElement('button'); del.className = 'copy ghost'; del.textContent = '刪除';
      let armed = false;
      del.onclick = async () => {
        if (!armed) { armed = true; del.textContent = '確定刪除？'; del.style.background = '#c1121f'; setTimeout(() => { armed = false; del.textContent = '刪除'; del.style.background = ''; }, 3000); return; }
        del.disabled = true;
        try { await deleteDoc(doc(db, 'saves', r.code)); rows = rows.filter(x => x.code !== r.code); render(); }
        catch (e) { del.textContent = '失敗'; $('msg').textContent = '刪除失敗：' + e.message; }
      };
      const tdDel = document.createElement('td'); tdDel.appendChild(del); tr.appendChild(tdDel);
      tb.appendChild(tr);
    }
  }

  // ===== 活動開關：沒設定時遊戲依內建日期自動開關（萬聖節 10/25～11/2）；這裡可以強制開某段時間或強制關閉 =====
  const evRef = () => doc(db, 'config', 'event');
  async function loadEvent() {
    try {
      const s = await getDoc(evRef()), d = s.exists() ? s.data() : null;
      $('evmsg').textContent = !d ? '目前：依日期自動（萬聖節每年 10/25～11/2）' : d.off ? '目前：強制關閉所有活動' : `目前：強制開啟 ${d.id}，${d.from} ～ ${d.to}`;
      if (d && d.from) { $('ev-from').value = d.from; $('ev-to').value = d.to; $('ev-id').value = d.id; }
    } catch (e) { $('evmsg').textContent = '活動設定讀取失敗：' + e.message; }
  }
  const evDo = async (fn, ok) => { try { await fn(); $('evmsg').textContent = ok; setTimeout(loadEvent, 800); } catch (e) { $('evmsg').textContent = '失敗：' + e.message; } };
  $('ev-on').onclick = () => {
    const from = $('ev-from').value, to = $('ev-to').value;
    if (!from || !to || from > to) { $('evmsg').textContent = '請先選好開始和結束日期'; return; }
    evDo(() => setDoc(evRef(), { id: $('ev-id').value, from, to }), '✅ 已開啟，玩家重新打開遊戲就會看到');
  };
  $('ev-off').onclick = () => evDo(() => setDoc(evRef(), { off: true }), '✅ 已關閉所有活動');
  $('ev-auto').onclick = () => evDo(() => deleteDoc(evRef()), '✅ 已恢復依日期自動');

  // ===== 排行榜玩家管理：移除、封鎖 =====
  let profiles = [], bannedSet = new Set();
  async function loadProfiles() {
    try {
      const [ps, bs] = await Promise.all([getDocs(query(collection(db, 'profiles'), orderBy('best', 'desc'))), getDocs(collection(db, 'banned'))]);
      profiles = ps.docs.map(d => ({ uid: d.id, ...d.data() }));
      bannedSet = new Set(bs.docs.map(d => d.id));
      renderProfiles();
    } catch (e) { $('pmsg').textContent = '排行榜讀取失敗：' + e.message; }
  }
  // 按兩次才會執行（第一次變紅色「確定？」，3 秒內再按一次）
  function armedButton(label, confirmLabel, fn) {
    const b = document.createElement('button'); b.className = 'copy ghost'; b.textContent = label;
    let armed = false;
    b.onclick = async () => {
      if (!armed) { armed = true; b.textContent = confirmLabel; b.style.background = '#c1121f'; setTimeout(() => { armed = false; b.textContent = label; b.style.background = ''; }, 3000); return; }
      b.disabled = true;
      try { await fn(); } catch (e) { b.textContent = '失敗'; $('pmsg').textContent = '操作失敗：' + e.message; }
    };
    return b;
  }
  function renderProfiles() {
    const tb = $('prows'); tb.innerHTML = '';
    for (const p of profiles) {
      const tr = document.createElement('tr'), t = p.updatedAt ? p.updatedAt.toDate().toLocaleString('zh-TW', { hour12: false }) : '—';
      [p.name || '—', p.code || '—', p.best ?? 0, p.endless ?? 0, p.cleared ?? 0, t].forEach((v, i) => {
        const td = document.createElement('td'); td.textContent = v; if (i === 1) td.className = 'code'; if (i >= 2 && i <= 4) td.className = 'num'; tr.appendChild(td);
      });
      const td = document.createElement('td');
      td.appendChild(armedButton('移除', '確定移除？', async () => { await deleteDoc(doc(db, 'profiles', p.uid)); profiles = profiles.filter(x => x !== p); renderProfiles(); }));
      td.appendChild(armedButton('封鎖', '確定封鎖？', async () => {
        await setDoc(doc(db, 'banned', p.uid), { name: p.name || '', code: p.code || '', best: p.best ?? 0, at: serverTimestamp() });
        await deleteDoc(doc(db, 'profiles', p.uid)); profiles = profiles.filter(x => x !== p); renderProfiles();
      }));
      tr.appendChild(td); tb.appendChild(tr);
    }
    $('pmsg').textContent = `共 ${profiles.length} 位上榜・已封鎖 ${bannedSet.size} 位。「移除」：從排行榜拿掉（玩家下次開遊戲會重新出現）。「封鎖」：拿掉而且不能再上榜、送禮、發挑戰。`;
  }

  onAuthStateChanged(auth, u => {
    // 同一個網站的遊戲會自動匿名登入；匿名身分不能管理，當成沒登入，顯示 Google 登入按鈕
    const user = u && !u.isAnonymous ? u : null;
    $('login').hidden = !!user; $('logout').hidden = !user;
    $('who').textContent = user ? `已登入：${user.displayName || ''}` : '';
    if (user) load(); else { $('list').hidden = true; $('msg').textContent = '請用管理員的 Google 帳號登入。'; }
  });
}
</script>
</body>
</html>
